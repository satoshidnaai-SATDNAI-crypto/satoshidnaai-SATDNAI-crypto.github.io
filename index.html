<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI — Satoshi's Idea Reborn With AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:black;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

/* MATRIX BACKGROUND */
#matrix{
  position:fixed;
  inset:0;
  z-index:0;
}

/* MAIN CONTAINER */
.container{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px;
  z-index:2;
}

/* LOGO ANIMATION */
#logo{
  width:420px;
  margin-bottom:30px;
  filter: drop-shadow(0 0 15px rgba(0,255,200,0.7));
  animation:
    float 5s ease-in-out infinite,
    glow 2.5s ease-in-out infinite alternate,
    wave 8s linear infinite;
}

h1{
  font-size:64px;
  letter-spacing:6px;
  margin-bottom:25px;
  animation:fadeIn 2s ease forwards;
}

p{
  max-width:900px;
  font-size:20px;
  line-height:1.6;
  margin-bottom:35px;
}

/* BUTTON */
.button{
  margin-top:35px;
  padding:14px 36px;
  border-radius:40px;
  background:linear-gradient(90deg,#00ffc6,#00ff88);
  color:black;
  font-weight:bold;
  text-decoration:none;
  transition:.3s;
}

.button:hover{transform:scale(1.08)}

/* ANIMATIONS */
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
  100%{transform:translateY(0)}
}

@keyframes glow{
  from{filter:drop-shadow(0 0 12px #00ff88)}
  to{filter:drop-shadow(0 0 35px #00ff88)}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes wave{
  0%   { transform: translateY(0) rotate(0deg); }
  25%  { transform: translateY(-12px) rotate(0.3deg); }
  50%  { transform: translateY(0) rotate(0deg); }
  75%  { transform: translateY(12px) rotate(-0.3deg); }
  100% { transform: translateY(0) rotate(0deg); }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">
  <img src="Logo.png.jpeg" id="logo" alt="SATDNAI Logo">
  <h1>SATDNAI</h1>
  <p>
    SATDNAI represents the rebirth of Satoshi’s idea — a concept originally crafted years ago by the creator of Bitcoin,
    now reimagined and revived through the power of artificial intelligence.
  </p>
  <a class="button" href="#">Coming Soon on Solana</a>
</div>

<script>
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

let fontSize=16;
let letters="01 SATDNAI AI BLOCKCHAIN SOLANA CRYPTO ";
let columns;
let drops;

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
  columns=Math.floor(canvas.width/fontSize);
  drops=Array(columns).fill(0);
}

resize();
addEventListener("resize",resize);

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ff88";
  ctx.font=fontSize+"px monospace";

  for(let i=0;i<drops.length;i++){
    const text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
      drops[i]=0;
    drops[i]++;
  }
}

setInterval(draw,33);
</script>

</body>
</html>
