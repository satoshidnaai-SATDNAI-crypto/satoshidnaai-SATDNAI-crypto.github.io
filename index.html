<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;color:white;overflow:hidden;font-family:Arial}
.wrapper{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory}
.section{height:100vh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
canvas{position:absolute;inset:0}
h1{font-size:60px;z-index:2}
p{color:#ccc;z-index:2}
.nav{position:fixed;top:20px;right:30px;z-index:20}
.nav a{color:white;margin-left:20px;text-decoration:none;font-weight:bold}
</style>
</head>

<body>

<div class="nav">
<a href="#s1">Home</a>
<a href="#s2">Bitcoin</a>
<a href="#s3">Energy</a>
</div>

<div class="wrapper">

<section id="s1" class="section">
<canvas id="matrix"></canvas>
<h1>SATDNAI</h1>
<p>Satoshi Reborn With AI</p>
</section>

<section id="s2" class="section">
<canvas id="coins"></canvas>
<h1>Bitcoin Rain</h1>
</section>

<section id="s3" class="section">
<canvas id="electric"></canvas>
<h1>AI Energy Flow</h1>
</section>

</div>

<script>
// MATRIX
const m=document.getElementById("matrix"),mctx=m.getContext("2d");
m.width=innerWidth;m.height=innerHeight;
let letters="01",font=16,cols=m.width/font,drops=[];
for(let i=0;i<cols;i++)drops[i]=1;
setInterval(()=>{
 mctx.fillStyle="rgba(0,0,0,.05)";
 mctx.fillRect(0,0,m.width,m.height);
 mctx.fillStyle="#00ff99";
 mctx.font=font+"px monospace";
 for(let i=0;i<drops.length;i++){
  let t=letters[Math.floor(Math.random()*letters.length)];
  mctx.fillText(t,i*font,drops[i]*font);
  if(drops[i]*font>m.height&&Math.random()>0.98)drops[i]=0;
  drops[i]++;
 }
},33);

// REALISTIC BITCOIN COINS
const c=document.getElementById("coins"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
const coins=[];
for(let i=0;i<40;i++){
 coins.push({x:Math.random()*c.width,y:Math.random()*c.height,r:22+Math.random()*10,s:1+Math.random()*2});
}
function drawCoins(){
 ctx.clearRect(0,0,c.width,c.height);
 coins.forEach(o=>{
  let g=ctx.createRadialGradient(o.x-o.r/3,o.y-o.r/3,5,o.x,o.y,o.r);
  g.addColorStop(0,"#fff7b2");
  g.addColorStop(0.4,"#ffd700");
  g.addColorStop(1,"#b8860b");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#ffae00";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle="#6b3e00";
  ctx.font=o.r+"px Arial Black";
  ctx.fillText("₿",o.x-o.r/2.4,o.y+o.r/2.5);
  o.y+=o.s;
  if(o.y>c.height){o.y=-o.r;o.x=Math.random()*c.width}
 });
 requestAnimationFrame(drawCoins);
}
drawCoins();

// ELECTRIC FLOW
const e=document.getElementById("electric"),ectx=e.getContext("2d");
e.width=innerWidth;e.height=innerHeight;
function lightning(){
 ectx.fillStyle="rgba(0,0,0,.15)";
 ectx.fillRect(0,0,e.width,e.height);
 for(let i=0;i<3;i++){
  let x=Math.random()*e.width,y=0;
  ectx.beginPath();
  ectx.moveTo(x,y);
  for(let j=0;j<30;j++){
   x+=Math.random()*60-30;
   y+=e.height/30;
   ectx.lineTo(x,y);
  }
  ectx.strokeStyle="rgba(0,200,255,.8)";
  ectx.lineWidth=2;
  ectx.shadowBlur=20;
  ectx.shadowColor="#00ccff";
  ectx.stroke();
 }
 requestAnimationFrame(lightning);
}
lightning();
</script>

</body>
</html>
