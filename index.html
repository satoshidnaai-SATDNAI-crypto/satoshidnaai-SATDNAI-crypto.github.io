<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI | NEW GEN PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --matrix-green: #00FF41;
            --pure-white: #ffffff;
            --deep-black: #000000;
            --token-gold: #FFD700;
        }

        body {
            margin: 0; background: var(--deep-black); color: var(--pure-white);
            font-family: 'Rajdhani', sans-serif; overflow-x: hidden;
        }

        /* 1. قیمت‌های لحظه‌ای (۳۰ توکن) */
        .price-bar {
            width: 100%; background: #080808; border-bottom: 1px solid #222;
            padding: 12px 0; position: fixed; top: 0; z-index: 10000;
        }
        .price-track {
            display: flex; white-space: nowrap; animation: movePrice 60s linear infinite;
        }
        .p-item { margin-right: 60px; font-family: 'Orbitron'; font-size: 0.8rem; color: var(--matrix-green); }
        .p-item span { color: white; }
        @keyframes movePrice { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* 2. هیروی جدید با لوگوی بدون نور */
        .hero {
            height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; position: relative;
        }
        .main-logo-clean {
            width: 350px; z-index: 5; /* نور سبز حذف شده */
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
        }

        /* 3. بخش مشخصات توکن (اضافه شده) */
        .token-details {
            padding: 60px 10%; background: #050505; border-top: 1px solid #111;
        }
        .details-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px; margin-top: 40px;
        }
        .detail-card {
            background: #0a0a0a; padding: 30px; border-left: 3px solid var(--matrix-green);
        }
        .detail-card h3 { color: var(--token-gold); margin: 0 0 10px 0; font-family: 'Orbitron'; }
        .detail-card p { font-size: 1.5rem; font-weight: bold; margin: 0; }

        /* 4. گالری تصاویر بسیار بزرگ */
        .big-gallery { padding: 40px 2%; display: flex; flex-direction: column; gap: 20px; }
        .gallery-row { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; }
        .gallery-row::-webkit-scrollbar { height: 5px; }
        .gallery-row::-webkit-scrollbar-thumb { background: var(--matrix-green); }
        
        .huge-img {
            min-width: 500px; height: 500px; background-size: cover;
            background-position: center; border: 1px solid #333;
            transition: 0.5s; cursor: pointer;
        }
        .huge-img:hover { transform: scale(0.98); border-color: var(--matrix-green); }

        /* 5. ویدیوهای کنار هم (Hover Play) */
        .video-section {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(45%, 1fr));
            gap: 10px; padding: 20px;
        }
        .vid-wrap { position: relative; overflow: hidden; background: #000; border: 1px solid #111; }
        video { width: 100%; transition: 0.4s; opacity: 0.7; }
        .vid-wrap:hover video { opacity: 1; transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="price-bar">
        <div class="price-track" id="liveTicker"></div>
    </div>

    <section class="hero">
        <img src="logo.png" alt="SATDNAAI" class="main-logo-clean">
        <h1 style="font-family: 'Orbitron'; letter-spacing: 15px; margin-top: 30px;">SATOSHIDNAAI</h1>
    </section>

    <section class="token-details">
        <h2 style="font-family:'Orbitron'; color:var(--matrix-green)">TOKEN SPECIFICATIONS</h2>
        <div class="details-grid">
            <div class="detail-card"><h3>NAME</h3><p>SATOSHI DNA AI</p></div>
            <div class="detail-card"><h3>SYMBOL</h3><p>$SATDNAAI</p></div>
            <div class="detail-card"><h3>TAX</h3><p>0.5% BUY / SELL</p></div>
            <div class="detail-card"><h3>NETWORK</h3><p>SOLANA / BSC</p></div>
        </div>
    </section>

    <h2 style="padding: 40px 5%; font-family:'Orbitron'">DATA STRUCTURE (LARGE VIEW)</h2>
    <section class="big-gallery">
        <div class="gallery-row">
            <div class="huge-img" style="background-image: url('1.jpg');"></div>
            <div class="huge-img" style="background-image: url('10.jpg');"></div>
            <div class="huge-img" style="background-image: url('11.png');"></div>
            <div class="huge-img" style="background-image: url('12.png');"></div>
            <div class="huge-img" style="background-image: url('13.png');"></div>
        </div>
    </section>

    <h2 style="padding: 40px 5%; font-family:'Orbitron'">OPERATIONAL VIDEOS</h2>
    <section class="video-section">
        <div class="vid-wrap" onmouseover="this.querySelector('video').play()" onmouseout="this.querySelector('video').pause()">
            <video src="01.mp4" loop muted playsinline></video>
        </div>
        <div class="vid-wrap" onmouseover="this.querySelector('video').play()" onmouseout="this.querySelector('video').pause()">
            <video src="02.mp4" loop muted playsinline></video>
        </div>
        <div class="vid-wrap" onmouseover="this.querySelector('video').play()" onmouseout="this.querySelector('video').pause()">
            <video src="03.mp4" loop muted playsinline></video>
        </div>
        <div class="vid-wrap" onmouseover="this.querySelector('video').play()" onmouseout="this.querySelector('video').pause()">
            <video src="04.mp4" loop muted playsinline></video>
        </div>
    </section>

    <script>
        async function fetchPrices() {
            const track = document.getElementById('liveTicker');
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin,ripple,cardano,dogecoin,polkadot,tron,chainlink,polygon,litecoin,shiba-inu,dai,bitcoin-cash,uniswap,avalanche-2,cosmos,stellar,okb,monero,ethereum-classic,filecoin,kaspa,lido-dao,aptos,near,arbitrum,render-token,optimism&vs_currencies=usd');
                const data = await res.json();
                const coins = Object.entries(data);
                track.innerHTML = '';
                [...coins, ...coins].forEach(([id, p]) => {
                    const div = document.createElement('div');
                    div.className = 'p-item';
                    div.innerHTML = `<span>${id.toUpperCase()}</span> $${p.usd}`;
                    track.appendChild(div);
                });
            } catch (e) { track.innerHTML = "PRICE FEED ERROR"; }
        }
        fetchPrices(); setInterval(fetchPrices, 60000);
    </script>
</body>
</html>
