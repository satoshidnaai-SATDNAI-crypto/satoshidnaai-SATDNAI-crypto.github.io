<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* بک‌گراند لوگو */
.logo-bg{
    position:fixed;
    inset:0;
    background:url("logo.jpg") no-repeat center center;
    background-size: contain;
}

/* متن زیر لوگو */
.caption{
    position:fixed;
    bottom:40px;
    width:100%;
    text-align:center;
    font-size:22px;
    color:#7fd3ff;
}

/* آیکون‌های شبکه اجتماعی */
.socials{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:14px;
}

.socials a{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    transition:0.25s;
}

.socials a:hover{
    transform:scale(1.15);
    background:rgba(0,255,160,0.25);
}

.socials img{
    width:24px;
}
</style>
</head>

<body>

<div class="logo-bg"></div>

<div class="caption">
    Coming Soon on the Solana Blockchain
</div>

<div class="socials">
    <a href="https://t.me/SATDNAI" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">
    </a>
    <a href="https://www.tiktok.com/@satoshidnaai" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png">
    </a>
    <a href="https://www.youtube.com/@SATDNAI" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
    </a>
    <a href="https://x.com/SatoDnaAi" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968830.png">
    </a>
</div>

</body>
</html>
