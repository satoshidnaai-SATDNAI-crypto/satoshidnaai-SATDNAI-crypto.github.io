<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --matrix-green: #00FF41;
            --cyan-glow: #00f2ff;
            --dark-bg: #000000;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--dark-bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* ثابت نگه داشتن افکت ماتریکس در پس‌زمینه */
        #matrixCanvas {
            position: fixed; top: 0; left: 0; z-index: -1;
            width: 100%; height: 100%; opacity: 0.25;
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        /* --- نوار ناوبری نئونی --- */
        nav {
            position: fixed; top: 0; width: 100%;
            display: flex; justify-content: center; gap: 30px;
            z-index: 1000; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px); padding: 20px 0;
            border-bottom: 1px solid var(--matrix-green);
        }
        nav a { color: white; text-decoration: none; font-size: 0.7rem; letter-spacing: 3px; font-weight: bold; }
        nav a:hover { color: var(--cyan-glow); text-shadow: 0 0 10px var(--cyan-glow); }

        /* --- صفحه ۱: مرکزیت لوگو و تصاویر جانبی --- */
        .hero-group {
            display: flex; align-items: center; justify-content: center; gap: 50px;
        }
        .side-img {
            width: 180px; border: 2px solid var(--matrix-green);
            box-shadow: 0 0 20px var(--matrix-green); border-radius: 12px;
        }
        .main-logo-img { width: 320px; filter: drop-shadow(0 0 25px var(--cyan-glow)); }

        /* --- صفحه ۲: طراحی دقیق توکنومیکس (مشابه تصویر ارسالی) --- */
        .tk-title { color: var(--cyan-glow); font-size: 2.2rem; margin-bottom: 60px; text-shadow: 0 0 15px var(--cyan-glow); }
        .token-layout {
            position: relative; width: 100%; max-width: 900px; height: 500px;
            display: flex; justify-content: center; align-items: center;
        }
        .hub-circle {
            width: 260px; height: 260px; border: 4px solid var(--matrix-green);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px var(--matrix-green); background: rgba(0,0,0,0.9);
            z-index: 5;
        }
        .hub-circle h2 { font-size: 2.5rem; color: white; letter-spacing: 4px; }
        
        .tk-panel {
            position: absolute; width: 200px; padding: 20px;
            border: 2px solid var(--matrix-green); background: rgba(0, 255, 65, 0.05);
            text-align: center; border-radius: 15px; box-shadow: 0 0 20px var(--matrix-green);
            backdrop-filter: blur(5px);
        }
        .p-tl { top: 0; left: 0; }
        .p-tr { top: 0; right: 0; }
        .p-bl { bottom: 0; left: 0; }
        .p-br { bottom: 0; right: 0; }
        
        .tk-panel h4 { margin: 0; font-size: 0.75rem; color: var(--cyan-glow); letter-spacing: 1px; }
        .tk-panel p { margin: 12px 0 0; font-size: 1.8rem; font-weight: 900; }

        /* --- صفحه ۳: گالری عکس و ویدیو --- */
        .multimedia-grid {
            width: 100%; max-width: 1100px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;
        }
        .main-video-wrapper { 
            grid-column: 1 / -1; margin-bottom: 40px; 
            border: 2px solid var(--cyan-glow); box-shadow: 0 0 30px var(--cyan-glow);
        }
        .main-video-wrapper video { width: 100%; display: block; }
        
        .img-card {
            aspect-ratio: 1/1; overflow: hidden; border: 1px solid var(--matrix-green);
            position: relative; transition: 0.4s;
        }
        .img-card img { width: 100%; height: 100%; object-fit: cover; }
        .img-card:hover { transform: translateY(-5px); box-shadow: 0 0 20px var(--matrix-green); border-color: white; }

    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <nav>
        <a href="#home">HOME</a>
        <a href="#tokenomics">TOKENOMICS</a>
        <a href="#multimedia">MULTIMEDIA</a>
    </nav>

    <section id="home">
        <div class="hero-group">
            <img src="jpg5.jpg" class="side-img" alt="SATOSHI Side">
            <img src="logo.png" class="main-logo-img" alt="SATOSHI DNA AI">
            <img src="jpg11.jpg" class="side-img" alt="DNA Side">
        </div>
        <p style="margin-top: 50px; letter-spacing: 6px; font-weight: bold; color: var(--matrix-green);">DECENTRALIZED INTELLIGENCE SYSTEM</p>
    </section>

    <section id="tokenomics">
        <h2 class="tk-title">TOKENOMICS AI</h2>
        <div class="token-layout">
            <div class="hub-circle">
                <h2>SDNA</h2>
            </div>
            
            <div class="tk-panel p-tl">
                <h4>BUY TAX</h4>
                <p>0.5%</p>
            </div>
            <div class="tk-panel p-tr">
                <h4>SELL TAX</h4>
                <p>0.5%</p>
            </div>
            <div class="tk-panel p-bl">
                <h4>TRANSFER TAX</h4>
                <p>0%</p>
            </div>
            <div class="tk-panel p-br">
                <h4>TOTAL SUPPLY</h4>
                <p style="font-size: 1.2rem;">1,000,000,000,000</p>
            </div>
        </div>
    </section>

    <section id="multimedia">
        <h2 style="color: var(--cyan-glow); margin-bottom: 50px; letter-spacing: 4px;">MULTIMEDIA HUB</h2>
        <div class="multimedia-grid">
            <div class="main-video-wrapper">
                <video controls poster="logo.png">
                    <source src="SATOSHIDNAAI.mp4" type="video/mp4">
                </video>
            </div>

            <div class="img-card"><img src="jpg1.jpg"></div>
            <div class="img-card"><img src="jpg2.jpg"></div>
            <div class="img-card"><img src="jpg3.jpg"></div>
            <div class="img-card"><img src="jpg4.jpg"></div>
            <div class="img-card"><img src="jpg6.jpg"></div>
            <div class="img-card"><img src="jpg7.jpg"></div>
            <div class="img-card"><img src="jpg8.jpg"></div>
            <div class="img-card"><img src="jpg9.jpg"></div>
            <div class="img-card"><img src="jpg10.jpg"></div>
            <div class="img-card"><img src="jpg12.jpg"></div>
            <div class="img-card"><img src="jpg01.jpg"></div>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "01010101SDNAAI";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 40);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
