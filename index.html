<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DNA Bitcoin Matrix</title>
<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

canvas{
    filter: drop-shadow(0 0 20px gold);
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let t = 0;

function drawDNA(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const cx = canvas.width/2;
    const cy = canvas.height/2;

    for(let i=0;i<300;i++){
        const y = i*5 - 750;
        const angle = i*0.15 + t;
        const x = Math.sin(angle)*120;

        const hue = 120 + Math.sin(angle)*60;
        ctx.strokeStyle = hsl(${hue},100%,50%);
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(cx + x, cy + y);
        ctx.lineTo(cx - x, cy + y);
        ctx.stroke();

        ctx.fillStyle = "rgba(0,255,0,0.6)";
        ctx.fillRect(cx + x - 2, cy + y - 2, 4, 4);
        ctx.fillRect(cx - x - 2, cy + y - 2, 4, 4);
    }

    // Bitcoin
    ctx.font = "120px Arial Black";
    ctx.fillStyle = "gold";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "gold";
    ctx.shadowBlur = 30;
    ctx.fillText("₿", cx, cy);
    ctx.shadowBlur = 0;
}

function animate(){
    t += 0.03;
    drawDNA();
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
