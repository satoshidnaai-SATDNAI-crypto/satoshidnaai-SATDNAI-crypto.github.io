<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI | MATRIX PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --m-green: #00FF41; /* سبز ماتریکسی */
            --c-glow: #00f2ff;  /* سایان نئونی */
            --dark: #000000;
        }

        body, html {
            margin: 0; padding: 0; background: var(--dark); color: white;
            font-family: 'Orbitron', sans-serif; scroll-behavior: smooth; overflow-x: hidden;
        }

        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; opacity: 0.25; }

        section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; box-sizing: border-box; }

        /* Navigation & Language Switcher */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 40px; background: rgba(0,0,0,0.85);
            border-bottom: 2px solid var(--m-green); z-index: 1000; box-sizing: border-box;
        }
        .lang-btns button {
            background: transparent; border: 1px solid var(--m-green); color: var(--m-green);
            padding: 6px 12px; cursor: pointer; font-family: 'Orbitron'; margin-right: 8px; transition: 0.3s;
        }
        .lang-btns button:hover, .lang-btns button.active { background: var(--m-green); color: black; box-shadow: 0 0 10px var(--m-green); }

        /* Page 1: Hero (Center Logo, Side Images 5 & 11) */
        .hero-wrap { display: flex; align-items: center; justify-content: center; gap: 30px; }
        .side-img { 
            width: 190px; border: 2px solid var(--m-green); border-radius: 10px;
            box-shadow: 0 0 20px var(--m-green); transition: 0.5s;
        }
        .side-img:hover { transform: scale(1.05); filter: brightness(1.2); }
        .main-logo { width: 330px; filter: drop-shadow(0 0 25px var(--c-glow)); }

        /* Page 2: Tokenomics (Matches your provided image) */
        .tk-container { position: relative; width: 100%; max-width: 850px; height: 480px; display: flex; align-items: center; justify-content: center; }
        .central-hub {
            width: 240px; height: 240px; border: 4px solid var(--m-green); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px var(--m-green); background: rgba(0,0,0,0.9); z-index: 10;
        }
        .panel {
            position: absolute; width: 180px; padding: 15px; border: 2px solid var(--m-green);
            background: rgba(0, 255, 65, 0.08); border-radius: 12px; text-align: center;
            box-shadow: 0 0 15px var(--m-green); backdrop-filter: blur(8px);
        }
        .tl { top: 10px; left: 0; } .tr { top: 10px; right: 0; }
        .bl { bottom: 10px; left: 0; } .br { bottom: 10px; right: 0; }
        .panel h4 { margin: 0; font-size: 0.75rem; color: var(--c-glow); text-transform: uppercase; }
        .panel p { margin: 10px 0 0; font-size: 1.6rem; font-weight: 900; }

        /* Page 3: Multimedia (Video + 12 Images) */
        .media-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 1100px; width: 100%; }
        .vid-box { grid-column: span 4; border: 2px solid var(--c-glow); box-shadow: 0 0 30px var(--c-glow); margin-bottom: 20px; }
        .vid-box video { width: 100%; display: block; }
        .img-item { width: 100%; aspect-ratio: 1; border: 1px solid var(--m-green); object-fit: cover; transition: 0.3s; }
        .img-item:hover { border-color: white; box-shadow: 0 0 15px var(--m-green); }

    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<nav>
    <div class="lang-btns">
        <button onclick="changeLang('en')" id="btn-en" class="active">EN</button>
        <button onclick="changeLang('jp')" id="btn-jp">JP</button>
        <button onclick="changeLang('cn')" id="btn-cn">CN</button>
    </div>
    <div style="letter-spacing: 2px; font-weight: bold; color: var(--m-green);">SATOSHI DNA AI</div>
</nav>

<section id="home">
    <div class="hero-wrap">
        <img src="jpg5.jpg" class="side-img" alt="Satoshi Left">
        <img src="logo.png" class="main-logo" alt="SDNA Core">
        <img src="jpg11.jpg" class="side-img" alt="AI Right">
    </div>
    <h1 style="color: var(--m-green); margin-top: 50px; letter-spacing: 10px; text-shadow: 0 0 10px var(--m-green);">SYSTEM ONLINE</h1>
</section>

<section id="tokenomics">
    <h2 style="color: var(--c-glow); margin-bottom: 40px; letter-spacing: 5px;" id="tk-title">TOKENOMICS AI</h2>
    <div class="tk-container">
        <div class="central-hub"><h2>SDNA</h2></div>
        <div class="panel tl"><h4 id="tax-buy-h">BUY TAX</h4><p>0.5%</p></div>
        <div class="panel tr"><h4 id="tax-sell-h">SELL TAX</h4><p>0.5%</p></div>
        <div class="panel bl"><h4 id="tax-trans-h">TRANSFER</h4><p>0%</p></div>
        <div class="panel br"><h4 id="tax-supp-h">TOTAL SUPPLY</h4><p style="font-size: 1.1rem;">1,000,000,000,000</p></div>
    </div>
</section>

<section id="multimedia">
    <div class="media-grid">
        <div class="vid-box">
            <video controls autoplay muted loop><source src="SATOSHIDNAAI.mp4" type="video/mp4"></video>
        </div>
        <img src="jpg1.jpg" class="img-item">
        <img src="jpg2.jpg" class="img-item">
        <img src="jpg3.jpg" class="img-item">
        <img src="jpg4.jpg" class="img-item">
        <img src="jpg6.jpg" class="img-item">
        <img src="jpg7.jpg" class="img-item">
        <img src="jpg8.jpg" class="img-item">
        <img src="jpg9.jpg" class="img-item">
        <img src="jpg10.jpg" class="img-item">
        <img src="jpg12.jpg" class="img-item">
        <img src="jpg01.jpg" class="img-item">
        <img src="logo.png" class="img-item">
    </div>
</section>

<script>
    const content = {
        en: { title: "TOKENOMICS AI", buy: "BUY TAX", sell: "SELL TAX", trans: "TRANSFER", supp: "TOTAL SUPPLY" },
        jp: { title: "AIトークノミクス", buy: "購入税", sell: "販売税", trans: "送金", supp: "総供給量" },
        cn: { title: "AI代币经济学", buy: "买入税", sell: "卖出税", trans: "转账", supp: "总供应量" }
    };

    function changeLang(lang) {
        document.getElementById('tk-title').textContent = content[lang].title;
        document.getElementById('tax-buy-h').textContent = content[lang].buy;
        document.getElementById('tax-sell-h').textContent = content[lang].sell;
        document.getElementById('tax-trans-h').textContent = content[lang].trans;
        document.getElementById('tax-supp-h').textContent = content[lang].supp;
        
        document.querySelectorAll('.lang-btns button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
    }

    // Matrix Background Effect
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = "01SDNAAI";
    const fontSize = 15;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0F0';
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 35);
</script>

</body>
</html>
