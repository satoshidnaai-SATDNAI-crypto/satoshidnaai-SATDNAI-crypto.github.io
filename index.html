<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:black;color:white;overflow:hidden;font-family:Arial,Helvetica,sans-serif}

.wrapper{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory}
.section{height:100vh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}

/* NAV */
.nav{position:fixed;top:20px;right:30px;z-index:20}
.nav a{color:white;text-decoration:none;margin-left:20px;font-weight:bold}

/* MATRIX */
#matrix{position:absolute;inset:0}

/* COIN RAIN */
#coins{position:absolute;inset:0;pointer-events:none}

/* CONTENT */
h1{font-size:64px}
p{color:#ccc;font-size:18px}
</style>
</head>

<body>

<div class="nav">
<a href="#home">Home</a>
<a href="#coinsPage">Coins</a>
<a href="#roadmap">Roadmap</a>
</div>

<div class="wrapper">

<!-- PAGE 1 -->
<section id="home" class="section">
<canvas id="matrix"></canvas>
<h1>SATDNAI</h1>
<p>Satoshi Reborn with AI</p>
</section>

<!-- PAGE 2 -->
<section id="coinsPage" class="section">
<canvas id="coins"></canvas>
<h1>Bitcoin Rain</h1>
<p>The Power of Digital Gold</p>
</section>

<!-- PAGE 3 -->
<section id="roadmap" class="section">
<h1>Roadmap</h1>
<p>Q1 Launch — Q2 Listings — Q3 AI Platform — Q4 Global Growth</p>
</section>

</div>

<script>
// MATRIX EFFECT
const m=document.getElementById("matrix"),mctx=m.getContext("2d");
m.width=innerWidth;m.height=innerHeight;
let letters="01",font=16,cols=m.width/font,drops=[];
for(let i=0;i<cols;i++)drops[i]=1;
setInterval(()=>{
 mctx.fillStyle="rgba(0,0,0,.05)";
 mctx.fillRect(0,0,m.width,m.height);
 mctx.fillStyle="#00ff99";
 mctx.font=font+"px monospace";
 for(let i=0;i<drops.length;i++){
   const t=letters[Math.floor(Math.random()*letters.length)];
   mctx.fillText(t,i*font,drops[i]*font);
   if(drops[i]*font>m.height&&Math.random()>0.975)drops[i]=0;
   drops[i]++;
 }
},33);

// BITCOIN RAIN
const c=document.getElementById("coins"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
const coins=[];
for(let i=0;i<50;i++){
 coins.push({
   x:Math.random()*c.width,
   y:Math.random()*c.height,
   r:20+Math.random()*20,
   s:1+Math.random()*2
 });
}
function drawCoins(){
 ctx.clearRect(0,0,c.width,c.height);
 coins.forEach(o=>{
  ctx.fillStyle="gold";
  ctx.beginPath();
  ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="black";
  ctx.font=o.r+"px Arial";
  ctx.fillText("₿",o.x-o.r/2,o.y+o.r/3);
  o.y+=o.s;
  if(o.y>c.height){o.y=-o.r;o.x=Math.random()*c.width}
 });
 requestAnimationFrame(drawCoins);
}
drawCoins();
</script>

</body>
</html>
