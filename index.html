<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI | Official Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --matrix-green: #00FF41;
            --gold: #FFD700;
            --solana: #00ffa3;
        }

        body, html { 
            margin: 0; padding: 0; 
            background: #000; 
            color: white; 
            font-family: 'Orbitron', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden; 
        }

        /* --- Social Sidebar --- */
        .social-sidebar {
            position: fixed;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 5000;
        }
        .social-item {
            position: relative;
            display: flex;
            align-items: center;
        }
        .social-icon {
            width: 40px; height: 40px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; font-size: 1.2rem; transition: 0.3s;
            z-index: 2;
        }
        .social-item::after {
            content: attr(data-name);
            position: absolute; left: 50px;
            background: var(--matrix-green);
            color: black; padding: 5px 12px;
            border-radius: 4px; font-size: 0.7rem; font-weight: 900;
            white-space: nowrap; opacity: 0;
            transform: translateX(-10px); transition: 0.3s; pointer-events: none;
        }
        .social-item:hover::after { opacity: 1; transform: translateX(0); }
        .social-icon:hover { transform: scale(1.1); }
        .tg:hover { background: #0088cc; box-shadow: 0 0 15px #0088cc; }
        .x-tw:hover { background: #000; box-shadow: 0 0 15px #fff; border-color: #fff; }
        .ig:hover { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%); box-shadow: 0 0 15px #d6249f; }
        .yt:hover { background: #ff0000; box-shadow: 0 0 15px #ff0000; }
        .tk:hover { background: #010101; box-shadow: 0 0 15px #ff0050; border-color: #00f2ea; }

        /* --- Real-Time Price Ticker --- */
        .price-ticker {
            width: 100%;
            background: rgba(0, 255, 65, 0.1);
            border-bottom: 1px solid var(--matrix-green);
            padding: 5px 0;
            position: fixed;
            top: 0; z-index: 2000;
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-content {
            display: inline-block;
            animation: ticker 120s linear infinite; /* افزایش زمان برای نمایش ۱۰۰ ارز */
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ticker-content span { margin-right: 40px; font-size: 0.8rem; color: var(--solana); font-weight: bold; }
        .ticker-content b { color: white; margin-left: 5px; }

        /* --- Navbar --- */
        nav {
            width: 100%; height: 70px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            position: fixed; top: 30px; display: flex; justify-content: space-between;
            align-items: center; padding: 0 50px; box-sizing: border-box; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-links a { color: white; text-decoration: none; margin: 0 20px; font-size: 0.8rem; transition: 0.3s; }
        .connect-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 8px 20px; cursor: pointer; }

        /* --- Hero --- */
        .hero-section { position: relative; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .main-logo { position: absolute; width: 500px; z-index: 1; pointer-events: none; }
        #matrixCanvas { position: absolute; top: 0; left: 0; z-index: 2; width: 100%; height: 100%; mix-blend-mode: lighten; }

        /* --- About --- */
        .about-section { background: #050505; border-top: 2px solid var(--gold); padding: 100px 20px; display: flex; flex-direction: column; align-items: center; }
        .rings-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 40px 0; }
        .ring { width: 160px; height: 160px; border: 3px solid var(--matrix-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 0 15px var(--matrix-green); background: rgba(0,0,0,0.7); }
    </style>
</head>
<body>

    <div class="social-sidebar">
        <div class="social-item" data-name="TELEGRAM"><a href="#" class="social-icon tg"><i class="fab fa-telegram-plane"></i></a></div>
        <div class="social-item" data-name="X (TWITTER)"><a href="#" class="social-icon x-tw"><i class="fab fa-x-twitter"></i></a></div>
        <div class="social-item" data-name="INSTAGRAM"><a href="#" class="social-icon ig"><i class="fab fa-instagram"></i></a></div>
        <div class="social-item" data-name="YOUTUBE"><a href="#" class="social-icon yt"><i class="fab fa-youtube"></i></a></div>
        <div class="social-item" data-name="TIKTOK"><a href="#" class="social-icon tk"><i class="fab fa-tiktok"></i></a></div>
    </div>

    <div class="price-ticker">
        <div class="ticker-content" id="ticker-box">
            <span>LOADING MARKET DATA...</span>
        </div>
    </div>

    <nav>
        <div style="font-weight: 900; color: var(--matrix-green);">SATOSHI+DNA+AI</div>
        <div class="nav-links">
            <a href="#">HOME</a><a href="#about">ABOUT</a><a href="#tokenomics">TOKENOMICS</a>
            <button class="connect-btn">CONNECT WALLET</button>
        </div>
    </nav>

    <section class="hero-section">
        <img src="logo.png" alt="Logo" class="main-logo">
        <canvas id="matrixCanvas"></canvas>
    </section>

    <section id="about" class="about-section">
        <h2 style="color: var(--gold); font-size: 2rem;">Satoshidnaai (SATDNAAI)</h2>
        <div class="rings-container">
            <div class="ring">SATOSHI</div><div style="font-size:2rem;color:var(--gold)">+</div>
            <div class="ring">DNA</div><div style="font-size:2rem;color:var(--gold)">+</div>
            <div class="ring">AI</div>
        </div>
    </section>

    <script>
        // --- 1. Real-Time Price Fetching (Top 100) ---
        async function updatePrices() {
            try {
                // دریافت ۱۰۰ کوین برتر از CoinGecko
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false');
                const data = await response.json();
                
                const tickerBox = document.getElementById('ticker-box');
                let content = "";
                
                // اضافه کردن توکن اختصاصی در اول لیست
                content += `<span>SATDNAAI: <b>$0.0000104</b></span>`;
                
                // اضافه کردن ۱۰۰ کوین برتر
                data.forEach(coin => {
                    content += `<span>${coin.symbol.toUpperCase()}: <b>$${coin.current_price.toLocaleString()}</b></span>`;
                });

                tickerBox.innerHTML = content;
            } catch (error) {
                console.log("Price fetch failed.");
                document.getElementById('ticker-box').innerHTML = "<span>MARKET OFFLINE - CHECK CONNECTION</span>";
            }
        }
        
        // آپدیت قیمت ها هر ۶۰ ثانیه
        setInterval(updatePrices, 60000); 
        updatePrices();

        // --- 2. Matrix Animation (Original) ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const allChars = "ｱｲｳｴｵｶｷｸｹｺ龙币人工智能DNA0123456789SATOSHIDNAAI";
        const fontSize = 18;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const char = allChars.charAt(Math.floor(Math.random() * allChars.length));
                ctx.fillStyle = (Math.random() > 0.8) ? "#FFFFFF" : "#00FF41"; 
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
