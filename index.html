<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI — Satoshi’s Idea Reborn With AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:black;
  color:white;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

/* Matrix background */
#matrix{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  z-index:0;
}

/* Content */
.container{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px;
  z-index:2;
  animation:fadeIn 2.5s ease forwards;
}

h1{
  font-size:64px;
  letter-spacing:6px;
  margin:25px 0;
}

p{
  max-width:900px;
  font-size:20px;
  line-height:1.6;
  color:#b5f5d5;
}

.button{
  margin-top:35px;
  padding:14px 36px;
  border-radius:40px;
  background:linear-gradient(90deg,#00ffc6,#00ff88);
  color:black;
  text-decoration:none;
  font-weight:bold;
  transition:.3s;
}

.button:hover{
  transform:scale(1.08);
}

/* Logo */
#logo{
  width:260px;
  animation:float 4s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
}

/* Animations */
@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-20px);}
  100%{transform:translateY(0);}
}

@keyframes glow{
  from{filter:drop-shadow(0 0 12px #00ff88);}
  to{filter:drop-shadow(0 0 35px #00ff88);}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">
  <img src="logo.png" id="logo">

  <h1>SATDNAI</h1>

  <p>
  SATDNAI represents the rebirth of Satoshi’s idea — a concept originally crafted years ago by the creator of Bitcoin,
  now reimagined and revived through the power of artificial intelligence.
  </p>

  <a class="button" href="#">Coming Soon on Solana</a>
</div>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

const letters = "01 SATDNAI AI BLOCKCHAIN SOLANA CRYPTO ";
const fontSize = 16;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(0);

function draw(){
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff88";
  ctx.font = fontSize + "px monospace";

  for(let i=0;i<drops.length;i++){
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);

    if(drops[i]*fontSize > canvas.height && Math.random() > 0.98)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw,33);
</script>

</body>
</html>
