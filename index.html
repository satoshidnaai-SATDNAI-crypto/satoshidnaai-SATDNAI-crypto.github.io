<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI | DNA MATRIX MODE</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #matrix { position: fixed; inset: 0; z-index: 1; }

    .content-overlay {
        position: relative;
        z-index: 10;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }

    /* حذف کامل پس‌زمینه سیاه لوگو */
    .logo-box {
        width: 480px;
        mix-blend-mode: screen; 
        filter: contrast(1.2) brightness(1.2);
        animation: dna-float 5s ease-in-out infinite;
    }

    .logo-box img { width: 100%; height: auto; }

    @keyframes dna-float {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-20px) rotate(1deg); }
    }

    .caption {
        margin-top: 20px;
        font-family: 'Orbitron', sans-serif;
        font-size: 20px;
        color: #8fd3ff;
        text-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
    }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="content-overlay">
    <div class="logo-box">
        <img src="logo.png" alt="SATDNAI">
    </div>
    <div class="caption">
        <span>GENETIC ALGORITHM INITIALIZED</span>
    </div>
</div>

<script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    let width, height;
    const fontSize = 16;
    const chars = "01ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿABCDEFGHIJKLMNOPQRSTUVWXYZ";
    
    // پارامترهای DNA
    let columns;
    let frame = 0;

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        columns = Math.floor(width / fontSize);
    }

    function draw() {
        // افکت محو شدن برای ایجاد دنباله نوری
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.fillRect(0, 0, width, height);

        ctx.font = fontSize + "px monospace";
        frame++;

        for (let i = 0; i < columns; i++) {
            // محاسبه مسیر مارپیچ DNA با استفاده از تابع سینوسی
            // رشته اول
            const y1 = (Math.sin(frame * 0.05 + i * 0.2) * 100) + (height / 2);
            // رشته دوم (با اختلاف فاز ۱۸۰ درجه)
            const y2 = (Math.sin(frame * 0.05 + i * 0.2 + Math.PI) * 100) + (height / 2);

            const char1 = chars[Math.floor(Math.random() * chars.length)];
            const char2 = chars[Math.floor(Math.random() * chars.length)];

            // رسم رشته اول (سبز ماتریکسی)
            ctx.fillStyle = "#00ff41";
            ctx.fillText(char1, i * fontSize, y1 + (Math.random() * 50));

            // رسم رشته دوم (آبی/طلایی برای هارمونی با لوگو)
            ctx.fillStyle = i % 2 === 0 ? "#FFD700" : "#00d4ff";
            ctx.fillText(char2, i * fontSize, y2 - (Math.random() * 50));

            // درخشش تصادفی کاراکترها
            if(Math.random() > 0.98) {
                ctx.fillStyle = "#fff";
                ctx.fillText(char1, i * fontSize, y1);
            }
        }
    }

    window.addEventListener("resize", init);
    init();
    setInterval(draw, 30);
</script>
</body>
</html>
