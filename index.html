<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crypto Bubble Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    background: radial-gradient(circle at bottom, #020b1c, #000);
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.bubble {
    position:absolute;
    width:140px;
    height:140px;
    border-radius:50%;
    background: rgba(0,255,200,0.12);
    border:1px solid rgba(0,255,200,0.6);
    box-shadow: 0 0 20px rgba(0,255,200,0.4);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#7fffd4;
    animation: float 12s infinite ease-in-out;
    backdrop-filter: blur(8px);
}

@keyframes float {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-40px); }
    100% { transform: translateY(0px); }
}

.symbol {
    font-size:20px;
    font-weight:bold;
}

.price {
    font-size:16px;
    margin-top:6px;
    color:#fff;
}
</style>
</head>
<body>

<div class="bubble" style="left:10%; top:60%" id="btc"></div>
<div class="bubble" style="left:35%; top:40%" id="eth"></div>
<div class="bubble" style="left:60%; top:65%" id="sol"></div>
<div class="bubble" style="left:80%; top:35%" id="bnb"></div>

<script>
async function loadPrices() {
    const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin&vs_currencies=usd");
    const data = await res.json();

    setBubble("btc", "BTC", data.bitcoin.usd);
    setBubble("eth", "ETH", data.ethereum.usd);
    setBubble("sol", "SOL", data.solana.usd);
    setBubble("bnb", "BNB", data.binancecoin.usd);
}

function setBubble(id, name, price) {
    document.getElementById(id).innerHTML = 
        <div class="symbol">${name}</div>
        <div class="price">$${price.toLocaleString()}</div>
    ;
}

loadPrices();
setInterval(loadPrices, 15000);
</script>

</body>
</html>
