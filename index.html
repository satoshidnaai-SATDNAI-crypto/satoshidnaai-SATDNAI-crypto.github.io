<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshidnaai (SATDNAAI) | Matrix Edition</title>
    <style>
        /* استایل کلی */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Segoe UI', sans-serif;
        }

        /* بوم پس‌زمینه ماتریکس */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* لایه محتوا روی ماتریکس */
        .content-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* تاریک کردن ماتریکس برای خوانایی متن */
            display: flex;
            flex-direction: column;
        }

        /* هدر مشابه عکس */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #00ff41; /* سبز ماتریکسی */
            font-weight: bold;
            font-size: 1.2rem;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #00ff41;
        }

        .buy-btn-top {
            background: white;
            color: black;
            padding: 8px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* محتوای اصلی */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #00ff41;
        }

        .sub-heading {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px 30px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .hero p {
            max-width: 700px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .icons-group {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #00ff41;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ff41;
            background: rgba(0, 0, 0, 0.5);
        }

    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="content-layer">
        <nav>
            <div class="logo-section">
                <img src="https://via.placeholder.com/40/00ff41/000000?text=S" style="border-radius: 50%;">
                SATOSHIDNAAI
            </div>
            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">How to Buy</a>
                <a href="#">Tokenomics</a>
                <a href="#">Whitepaper</a>
            </div>
            <a href="#" class="buy-btn-top">BUY NOW</a>
        </nav>

        <div class="hero">
            <h1>Welcome to Satoshidnaai</h1>
            <div class="sub-heading">SATOSHI DNA AI ECOSYSTEM</div>
            <p>
                The digital evolution starts here. SATDNAAI merges the genetic legacy of Satoshi with cutting-edge Artificial Intelligence. 
                Experience the first self-evolving crypto asset.
            </p>
            
            <div class="icons-group">
                <div class="icon-circle">AI</div>
                <div class="icon-circle">DNA</div>
                <div class="icon-circle">SAT</div>
            </div>
        </div>
    </div>

    <script>
        // اسکریپت باران ماتریکسی
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ff41"; // رنگ سبز کلاسیک ماتریکس
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
