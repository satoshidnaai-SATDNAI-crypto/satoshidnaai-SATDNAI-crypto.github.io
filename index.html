<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
  font-family:Segoe UI,Arial,sans-serif;
}

/* MATRIX */
canvas{
  position:fixed;
  inset:0;
  z-index:1;
}

/* LOGO */
#logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:120px;
  font-weight:900;
  letter-spacing:5px;
  background:linear-gradient(90deg,#00f,#00c8ff,#00ffd5,#00c8ff,#00f);
  background-size:400% 100%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 25px #00ffd5);
  animation:shine 6s linear infinite, float 4s ease-in-out infinite;
  z-index:5;
}

@keyframes shine{
  from{background-position:0%}
  to{background-position:400%}
}
@keyframes float{
  0%,100%{transform:translate(-50%,-50%)}
  50%{transform:translate(-50%,-58%)}
}

/* PARTICLES */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:#00ffd5;
  pointer-events:none;
  z-index:4;
  animation:particle 2s linear forwards;
}

@keyframes particle{
  from{opacity:1;transform:translate(0,0) scale(1)}
  to{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="logo">SATDNAI</div>

<script>
/* MATRIX BACKGROUND */
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

let fontSize=18;
let letters="SATDNAI AI BLOCKCHAIN CRYPTO 01 ";
let drops=[];

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
  drops=Array(Math.floor(canvas.width/fontSize)).fill(0);
}
resize();
addEventListener("resize",resize);

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ffd5";
  ctx.font=fontSize+"px monospace";

  drops.forEach((y,i)=>{
    const text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,y*fontSize);
    if(y*fontSize>canvas.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  });
}
setInterval(draw,33);

/* DIGITAL PARTICLES */
const logo=document.getElementById("logo");
setInterval(()=>{
  const r=logo.getBoundingClientRect();
  for(let i=0;i<12;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left=r.left+r.width/2+"px";
    p.style.top=r.top+r.height/2+"px";
    p.style.setProperty("--x",(Math.random()*300-150)+"px");
    p.style.setProperty("--y",(Math.random()*300-150)+"px");
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }
},180);
</script>

</body>
</html>
