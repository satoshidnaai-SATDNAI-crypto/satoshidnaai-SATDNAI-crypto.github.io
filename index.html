<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi DNA AI - Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --matrix-green: #00FF41;
            --gold: #FFD700;
        }

        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: 'Orbitron', sans-serif; overflow-x: hidden; }

        /* --- نوار قیمت زنده --- */
        .price-ticker {
            width: 100%; background: rgba(0, 255, 65, 0.1); border-bottom: 1px solid var(--matrix-green);
            padding: 5px 0; position: fixed; top: 0; z-index: 2000; overflow: hidden; white-space: nowrap;
        }
        .ticker-content { display: inline-block; animation: ticker 40s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .ticker-content span { margin-right: 40px; font-size: 0.8rem; color: #00ffa3; }

        /* --- شبکه‌های اجتماعی (Slow Motion) --- */
        .social-sidebar {
            position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px; z-index: 3000;
        }
        .social-sidebar i {
            font-size: 24px; color: var(--gold); cursor: pointer;
            transition: transform 0.8s ease-in-out, color 0.3s;
            animation: slowFloat 4s ease-in-out infinite;
        }
        .social-sidebar i:hover { color: var(--matrix-green); transform: scale(1.3); }
        @keyframes slowFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- لایه‌بندی لوگو و ماتریس --- */
        .hero-container { position: relative; width: 100%; height: 100vh; overflow: hidden; background: #000; }
        
        /* لوگو در لایه زیرین */
        #main-logo {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; z-index: 1; /* زیر ماتریس */
            filter: drop-shadow(0 0 30px #000);
        }

        /* بوم ماتریس روی لوگو */
        #matrixCanvas {
            position: absolute; top: 0; left: 0;
            z-index: 5; /* روی لوگو */
            mix-blend-mode: screen; /* باعث می‌شود سیاهی ماتریس حذف و فقط نوشته‌ها روی لوگو بیفتند */
            opacity: 0.8;
        }

        /* --- صفحه دوم: حلقه‌ها --- */
        .rings-section { 
            min-height: 100vh; background: #050505; border-top: 2px solid var(--gold);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; z-index: 10;
        }
        .rings-container { display: flex; align-items: center; justify-content: center; gap: 30px; margin: 40px 0; }
        .ring {
            width: 150px; height: 150px; border: 3px solid var(--matrix-green); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            box-shadow: 0 0 15px var(--matrix-green); background: rgba(0,0,0,0.8);
        }
        .plus { font-size: 2rem; color: var(--gold); }
        .token-info {
            max-width: 800px; padding: 30px; border: 1px solid var(--gold);
            background: rgba(255,255,255,0.05); text-align: center; line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="price-ticker">
        <div class="ticker-content">
            <span>BTC: $68,432</span> <span>ETH: $3,542</span> <span>SOL: $145</span> <span>SATOSHI DNA: $0.00001</span>
        </div>
    </div>

    <div class="social-sidebar">
        <i class="fab fa-facebook"></i>
        <i class="fab fa-twitter"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-telegram"></i>
        <i class="fab fa-snapchat"></i>
        <i class="fab fa-tiktok"></i>
    </div>

    <div class="hero-container">
        <img src="logo.png" id="main-logo" alt="Satoshi DNA Logo">
        <canvas id="matrixCanvas"></canvas>
    </div>

    <section class="rings-section">
        <h2 style="color: var(--gold);">SYSTEM ARCHITECTURE</h2>
        <div class="rings-container">
            <div class="ring">SATOSHI</div>
            <div class="plus">+</div>
            <div class="ring">DNA</div>
            <div class="plus">+</div>
            <div class="ring">AI</div>
        </div>
        <div class="token-info">
            <h3>TOKENOMICS & DETAILS</h3>
            <p>اینجا تمامی توضیحات مربوط به توکن، شبکه سولانا و اهداف پروژه به صورت کامل قرار می‌گیرد. 
               ترکیب هوش مصنوعی با کدهای ژنتیکی بلاکچین برای خلق یک اکوسیستم پایدار.</p>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "ｱｲｳｴｵｶｷｸｹｺ0123456789DNAAI";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            // استفاده از شفافیت برای دیده شدن لوگوی زیرین
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00FF41";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
