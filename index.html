<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --satoshi-blue: #00d4ff; --dna-green: #39ff14; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; }
        
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: 1; }

        .main-ui { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; align-items: center; background: transparent; overflow-y: auto; }
        
        .brand-name { color: white; font-family: 'Orbitron'; letter-spacing: 12px; font-size: 3rem; margin: 30px 0; text-shadow: 0 0 10px #000; }

        /* --- حذف ۱۰۰ درصد پس‌زمینه سیاه --- */
        .logo-box {
            width: 450px;
            margin-top: 10px;
            /* این دستور جادویی است: هر پیکسلی که سیاه باشد را کاملاً شفاف می‌کند */
            mix-blend-mode: lighten; 
            filter: contrast(1.1) brightness(1.2);
            position: relative;
        }

        .logo-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* جلوگیری از ایجاد کادر دور عکس در حالت فوکوس */
        img:focus { outline: none; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="main-ui">
        <h1 class="brand-name">SATOSHIDNAAI</h1>
        
        <div class="logo-box">
            <img src="logo.png" alt="SATDNAAI Logo">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const char = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = char.charAt(Math.floor(Math.random() * char.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 35);
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    </script>
</body>
</html>
