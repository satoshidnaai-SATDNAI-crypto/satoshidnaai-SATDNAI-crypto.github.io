<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,Helvetica,sans-serif;
}

/* لوگوی اصلی */
.logo-bg{
    position:fixed;
    inset:0;
    background:url("logo.jpg") no-repeat center center;
    background-size: contain;
    z-index:1;
}

/* محافظ ملایم */
.logo-protect{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.05);
    z-index:2;
}

/* ماتریکس */
canvas{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.22;
}

/* نوار موشن متن */
.banner{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 28px;
    border-radius:50px;
    background:rgba(0,0,0,0.6);
    z-index:5;
    animation: float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translate(-50%,0)}
    50%{transform:translate(-50%,-12px)}
}

.banner-text{
    color:white;
    font-size:22px;
    letter-spacing:1px;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 5px #00ffa3 }
    to{ text-shadow:0 0 18px #00ffa3 }
}

/* لوگوی سولانا */
.solana-logo{
    width:34px;
    height:34px;
}
</style>
</head>

<body>

<div class="logo-bg"></div>
<div class="logo-protect"></div>
<canvas id="matrix"></canvas>

<div class="banner">
    <span class="banner-text">Coming Soon on the Solana Blockchain</span>
    <svg class="solana-logo" viewBox="0 0 256 256">
        <defs>
            <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#00ffa3"/>
                <stop offset="100%" stop-color="#dc1fff"/>
            </linearGradient>
        </defs>
        <rect x="40" y="40" width="176" height="30" rx="10" fill="url(#sol)"/>
        <rect x="40" y="113" width="176" height="30" rx="10" fill="url(#sol)"/>
        <rect x="40" y="186" width="176" height="30" rx="10" fill="url(#sol)"/>
    </svg>
</div>

<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

const chars = "01SATDNAIΞ₿ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 18;
let columns = Math.floor(canvas.width / fontSize);
let drops = new Array(columns).fill(1);

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#FFD700"; // طلایی
    ctx.font = fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){
        const char = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(char, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(draw,33);
</script>

</body>
</html>
