<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATDNAAI | Matrix Gold Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Orbitron', sans-serif;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        /* هدر */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .nav-links a {
            color: #ffd700; /* رنگ طلایی برای منوها */
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .nav-links a:hover { color: white; }

        /* دایره طلایی مرکزی */
        .hero {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .main-circle {
            width: 450px;
            height: 450px;
            border: 4px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(255, 215, 0, 0.2);
            animation: pulse 3s infinite ease-in-out;
        }

        .text-gold {
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            text-align: center;
        }

        .satoshi { font-size: 2.5rem; font-weight: 700; }
        .plus { font-size: 2rem; margin: 10px 0; color: white; }
        .dna { font-size: 2.5rem; font-weight: 700; }
        .ai { font-size: 3rem; font-weight: 900; letter-spacing: 5px; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
            50% { transform: scale(1.02); box-shadow: 0 0 70px rgba(255, 215, 0, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
        }

        .buy-now {
            margin-top: 40px;
            background: #ffd700;
            color: black;
            padding: 12px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .buy-now:hover { background: white; transform: translateY(-3px); }

    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="content-layer">
        <nav>
            <div style="color: #ffd700; font-weight: bold;">SATOSHI+DNA+AI=SATDNAI</div>
            <div class="nav-links">
                <a href="#">ABOUT</a>
                <a href="#">TOKENOMICS</a>
                <a href="#">WHITEPAPER</a>
            </div>
            <a href="#" class="buy-now" style="margin-top: 0; padding: 8px 20px;">BUY NOW</a>
        </nav>

        <div class="hero">
            <div class="main-circle">
                <div class="text-gold satoshi">SATOSHI</div>
                <div class="plus">+ DNA +</div>
                <div class="text-gold ai">AI</div>
            </div>
            <p style="color: white; margin-top: 30px; letter-spacing: 3px; opacity: 0.8;">THE EVOLUTION OF CRYPTO GENETICS</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "01"; // ماتریکس فقط با 0 و 1 برای تم علمی‌تر
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#004400"; // سبز بسیار تیره برای اینکه مزاحم طلایی نشود
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 35);
    </script>
</body>
</html>
