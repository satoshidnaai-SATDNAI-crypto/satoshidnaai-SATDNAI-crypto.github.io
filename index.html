<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI — Web3 AI Token</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:black;color:white;overflow:hidden}

/* MATRIX */
canvas{position:fixed;top:0;left:0;z-index:-1}

/* SCROLL SYSTEM */
.wrapper{
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}
.section{
  height:100vh;
  scroll-snap-align:start;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* HEADLINE */
h1{font-size:64px}
h2{font-size:42px}
p{max-width:720px;color:#ccc;font-size:18px}

/* GOLD BTC */
.btc{
  font-size:120px;
  font-weight:900;
  color:gold;
  text-shadow:0 0 20px #ffd700,0 0 50px #ffae00;
  margin:30px 0;
}

/* TOKEN PANEL */
.panel{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  width:90%;
  max-width:1000px;
  margin-top:40px;
}
.card{
  background:rgba(0,0,0,.7);
  border:1px solid rgba(0,255,255,.4);
  border-radius:14px;
  padding:24px;
  box-shadow:0 0 30px rgba(0,255,255,.2);
}

/* NAV */
.nav{
  position:fixed;
  top:20px;
  right:30px;
  z-index:10;
}
.nav a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  font-weight:bold;
}
.nav a:hover{color:#00ffff}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="nav">
  <a href="#home">Home</a>
  <a href="#market">Market</a>
  <a href="#roadmap">Roadmap</a>
</div>

<div class="wrapper">

<section id="home" class="section">
  <h1>SATDNAI</h1>
  <p>Satoshi Reborn with Artificial Intelligence</p>
  <div class="btc">₿</div>
</section>

<section id="market" class="section">
  <h2>Live Crypto Market</h2>
  <div class="panel">
    <div class="card">Bitcoin — <span id="btc">Loading...</span></div>
    <div class="card">Ethereum — <span id="eth">Loading...</span></div>
    <div class="card">Solana — <span id="sol">Loading...</span></div>
    <div class="card">SATDNAI — Coming Soon</div>
  </div>
</section>

<section id="roadmap" class="section">
  <h2>Roadmap 2026</h2>
  <div class="panel">
    <div class="card">Q1 — Token Launch</div>
    <div class="card">Q2 — Exchange Listings</div>
    <div class="card">Q3 — AI Ecosystem</div>
    <div class="card">Q4 — Global Expansion</div>
  </div>
</section>

</div>

<script>
// MATRIX EFFECT
const c=document.getElementById("matrix"),ctx=c.getContext("2d");
c.width=window.innerWidth;c.height=window.innerHeight;
let letters="01";letters=letters.split("");
let font=14,cols=c.width/font,drops=[];
for(let i=0;i<cols;i++)drops[i]=1;
function draw(){
  ctx.fillStyle="rgba(0,0,0,.05)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#00ff99";
  ctx.font=font+"px monospace";
  for(let i=0;i<drops.length;i++){
    let text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*font,drops[i]*font);
    if(drops[i]*font>c.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw,33);

// LIVE PRICES
async function loadPrices(){
 const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd");
 const d=await r.json();
 btc.innerText="$"+d.bitcoin.usd;
 eth.innerText="$"+d.ethereum.usd;
 sol.innerText="$"+d.solana.usd;
}
loadPrices();setInterval(loadPrices,10000);
</script>

</body>
</html>
