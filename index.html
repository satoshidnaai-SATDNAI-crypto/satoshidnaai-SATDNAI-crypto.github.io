<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:black;
    color:white;
    overflow:hidden;
}

/* Scroll Container */
.wrapper{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
}

/* Sections */
.section{
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

/* Colors */
#home{background:#020816}
#token{background:#050f24}
#roadmap{background:#020816}

/* Content */
h1{font-size:64px;margin-bottom:20px}
p{font-size:20px;color:#ccc;max-width:700px}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:40px;
    width:100%;
    max-width:900px;
}

.card{
    background:rgba(255,255,255,.05);
    padding:25px;
    border-radius:14px;
    border:1px solid rgba(0,255,255,.3);
    box-shadow:0 0 25px rgba(0,255,255,.1);
}

.nav{
    position:fixed;
    top:20px;
    right:30px;
    z-index:10;
}
.nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:600;
}
.nav a:hover{color:#00ffff}
</style>
</head>

<body>

<div class="nav">
    <a href="#home">Home</a>
    <a href="#token">Token</a>
    <a href="#roadmap">Roadmap</a>
</div>

<div class="wrapper">

<section id="home" class="section">
    <h1>SATDNAI</h1>
    <p>The future of Satoshi’s idea — Powered by Artificial Intelligence</p>
</section>

<section id="token" class="section">
    <h1>Tokenomics</h1>
    <div class="cards">
        <div class="card">Total Supply: 1B</div>
        <div class="card">Blockchain: Solana</div>
        <div class="card">Liquidity Locked</div>
        <div class="card">Community Owned</div>
    </div>
</section>

<section id="roadmap" class="section">
    <h1>Roadmap 2026</h1>
    <div class="cards">
        <div class="card">Q1 — Launch</div>
        <div class="card">Q2 — Listings</div>
        <div class="card">Q3 — AI Platform</div>
        <div class="card">Q4 — Global Expansion</div>
    </div>
</section>

</div>

</body>
</html>
