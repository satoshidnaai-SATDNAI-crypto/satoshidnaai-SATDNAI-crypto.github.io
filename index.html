<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeuralVerse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:#000;color:#fff}

#scroll-container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.scene{
  position:relative;
  height:100vh;
  scroll-snap-align:start;
  overflow:hidden;
}

/* UI */
.ui{
  position:fixed;
  top:24px;
  left:40px;
  z-index:10;
  font-size:20px;
  letter-spacing:2px;
}
.nav{
  position:fixed;
  top:26px;
  right:40px;
  z-index:10;
}
.nav a{
  color:#fff;
  margin-left:24px;
  text-decoration:none;
  font-weight:600;
}
.nav a:hover{color:#00eaff}

/* Headline */
.center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:5;
}
.center h1{font-size:72px;letter-spacing:4px}
.center p{max-width:600px;color:#ccc}

/* Canvas */
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* Glow */
.glow{
  text-shadow:0 0 20px #00eaff,0 0 60px rgba(0,234,255,.6);
}
.gold{
  text-shadow:0 0 20px gold,0 0 60px orange;
}
</style>
</head>

<body>

<div class="ui">NEURALVERSE</div>

<div class="nav">
<a href="#s1">Intro</a>
<a href="#s2">Gold</a>
<a href="#s3">Energy</a>
</div>

<div id="scroll-container">

<!-- MATRIX WORLD -->
<section id="s1" class="scene">
<canvas id="matrix"></canvas>
<div class="center">
<h1 class="glow">DIGITAL AWAKENING</h1>
<p>Where Intelligence meets the Infinite Network</p>
</div>
</section>

<!-- GOLD COIN WORLD -->
<section id="s2" class="scene">
<canvas id="coins"></canvas>
<div class="center">
<h1 class="gold">GOLDEN FLOW</h1>
<p>The digital gold era is unfolding</p>
</div>
</section>

<!-- ELECTRIC WORLD -->
<section id="s3" class="scene">
<canvas id="energy"></canvas>
<div class="center">
<h1 class="glow">ENERGY CORE</h1>
<p>Pure computational power in motion</p>
</div>
</section>

</div>

<script>
// MATRIX ENGINE
const m=document.getElementById("matrix"),mctx=m.getContext("2d");
m.width=innerWidth;m.height=innerHeight;
let letters="0123456789ABCDEF",font=16,cols=m.width/font,drops=[];
for(let i=0;i<cols;i++)drops[i]=1;
setInterval(()=>{
 mctx.fillStyle="rgba(0,0,0,.06)";
 mctx.fillRect(0,0,m.width,m.height);
 mctx.fillStyle="#00eaff";
 mctx.font=font+"px monospace";
 for(let i=0;i<drops.length;i++){
   let t=letters[Math.floor(Math.random()*letters.length)];
   mctx.fillText(t,i*font,drops[i]*font);
   if(drops[i]*font>m.height&&Math.random()>0.975)drops[i]=0;
   drops[i]++;
 }
},33);

// GOLD COIN RAIN
const c=document.getElementById("coins"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let coins=[];
for(let i=0;i<50;i++){
 coins.push({x:Math.random()*c.width,y:Math.random()*c.height,r:18+Math.random()*10,s:1+Math.random()*2});
}
function drawCoins(){
 ctx.clearRect(0,0,c.width,c.height);
 coins.forEach(o=>{
  let g=ctx.createRadialGradient(o.x-o.r/3,o.y-o.r/3,4,o.x,o.y,o.r);
  g.addColorStop(0,"#fff8cc");
  g.addColorStop(.4,"#ffd700");
  g.addColorStop(1,"#b8860b");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#6b3e00";
  ctx.font=o.r+"px Arial Black";
  ctx.fillText("₿",o.x-o.r/2.6,o.y+o.r/2.8);
  o.y+=o.s;
  if(o.y>c.height){o.y=-o.r;o.x=Math.random()*c.width}
 });
 requestAnimationFrame(drawCoins);
}
drawCoins();

// ENERGY FLOW
const e=document.getElementById("energy"),ectx=e.getContext("2d");
e.width=innerWidth;e.height=innerHeight;
function energyFlow(){
 ectx.fillStyle="rgba(0,0,0,.12)";
 ectx.fillRect(0,0,e.width,e.height);
 for(let i=0;i<3;i++){
   let x=Math.random()*e.width,y=0;
   ectx.beginPath();
   ectx.moveTo(x,y);
   for(let j=0;j<40;j++){
     x+=Math.random()*80-40;
     y+=e.height/40;
     ectx.lineTo(x,y);
   }
   ectx.strokeStyle="rgba(0,234,255,.8)";
   ectx.lineWidth=2;
   ectx.shadowBlur=20;
   ectx.shadowColor="#00eaff";
   ectx.stroke();
 }
 requestAnimationFrame(energyFlow);
}
energyFlow();
</script>

</body>
</html>
