<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SATDNAI — Code Logo</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:#eaf7ff;
  font-family:Arial, Helvetica, sans-serif;
}

/* ====== SCENE ====== */
.scene{
  position:relative;
  width:320px;
  height:520px;
  perspective:1000px;
}

/* ====== DNA HELIX ====== */
.helix{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  animation: spin 14s linear infinite;
}
@keyframes spin{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(360deg)}
}

.strand{
  position:absolute;
  left:50%;
  top:0;
  width:4px;
  height:100%;
  background:linear-gradient(#00e5ff,#00ff9c);
  transform:translateX(-50%);
  filter:drop-shadow(0 0 12px #00e5ff);
}

.node{
  position:absolute;
  left:50%;
  width:14px;height:14px;
  border-radius:50%;
  background:#00e5ff;
  box-shadow:0 0 10px #00e5ff,0 0 20px #00ff9c;
  transform-style:preserve-3d;
}

/* ====== CENTER COIN ====== */
.coin{
  position:absolute;
  left:50%; top:50%;
  width:110px; height:110px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #ffd86a, #ff9f00 55%, #b36a00);
  transform:translate(-50%,-50%) translateZ(40px);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 30px #ffb000, inset 0 0 12px rgba(255,255,255,.4);
}
.coin span{
  font-size:64px;
  font-weight:900;
  color:#3b2300;
  text-shadow:0 0 6px rgba(0,0,0,.5);
}

/* ====== TEXT ====== */
.title{
  position:absolute;
  left:50%;
  bottom:-60px;
  transform:translateX(-50%);
  font-size:48px;
  letter-spacing:4px;
  font-weight:900;
  color:#dff7ff;
  text-shadow:0 0 10px #00e5ff, 0 0 24px #00aaff;
}
.title i{color:#00e5ff; font-style:normal}
</style>
</head>
<body>

<div class="scene">
  <div class="helix" id="helix">
    <div class="strand"></div>
  </div>

  <div class="coin"><span>₿</span></div>

  <div class="title"><i>SAT</i>DNAI</div>
</div>

<script>
const helix = document.getElementById('helix');
const count = 36;
const height = 520;

for(let i=0;i<count;i++){
  const n = document.createElement('div');
  n.className = 'node';
  const t = i / count;
  const y = t * height;
  const angle = t * Math.PI * 8;
  const x = Math.sin(angle) * 60;
  const z = Math.cos(angle) * 60;
  n.style.top = y + 'px';
  n.style.transform = translateX(-50%) translateX(${x}px) translateZ(${z}px);
  helix.appendChild(n);
}
</script>

</body>
</html>
