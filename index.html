<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:black;font-family:Arial,Helvetica,sans-serif;overflow:hidden}

/* Layout */
.section{width:100%;height:100vh;position:relative;overflow:hidden}

/* Page 1 */
.hero{
  background:black;
}
.hero .logo-bg{
  position:absolute;
  inset:0;
  background:url("logo.jpg") no-repeat center/contain;
}
.caption{
  position:absolute;
  bottom:40px;
  width:100%;
  text-align:center;
  font-size:24px;
  color:#8fd3ff;
}

/* Page 2 */
#market{
  background:black;
}

/* Coin Rain */
#rain{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.coin{
  position:absolute;
  width:100px;
  height:100px;
  background-size:contain;
  background-repeat:no-repeat;
  animation:fall linear infinite;
}
@keyframes fall{
  from{transform:translateY(-120px) rotateY(0deg)}
  to{transform:translateY(110vh) rotateY(720deg)}
}

/* Social */
.socials{
  position:fixed;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:14px;
}
.socials a{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,.08);
}
.socials img{width:22px;height:22px}
</style>
</head>

<body>

<div class="socials">
<a href="https://t.me/SATDNAI" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
<a href="https://www.tiktok.com/@satoshidnaai" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png"></a>
<a href="https://www.youtube.com/@SATDNAI" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>
<a href="https://x.com/SatoDnaAi" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968830.png"></a>
<a href="https://www.instagram.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"></a>
</div>

<section class="section hero">
  <div class="logo-bg"></div>
  <div class="caption">Coming Soon on the Blockchain</div>
</section>

<section class="section" id="market">
  <div id="rain"></div>
</section>

<script>
const icons = [
 "https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg",
 "https://cryptologos.cc/logos/ethereum-eth-logo.svg",
 "https://cryptologos.cc/logos/solana-sol-logo.svg",
 "https://cryptologos.cc/logos/binance-coin-bnb-logo.svg",
 "https://cryptologos.cc/logos/cardano-ada-logo.svg"
];

const rain = document.getElementById("rain");

function spawn(){
  const c = document.createElement("div");
  c.className = "coin";
  c.style.left = Math.random()*100+"vw";
  c.style.animationDuration = 3+Math.random()*3+"s";
  c.style.backgroundImage = url(${icons[Math.floor(Math.random()*icons.length)]});
  rain.appendChild(c);
  setTimeout(()=>c.remove(),7000);
}

setInterval(spawn,80);
</script>

</body>
</html>
