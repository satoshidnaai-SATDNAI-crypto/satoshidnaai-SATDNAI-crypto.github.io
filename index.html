<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:black;font-family:Arial;overflow-y:auto}

section{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* ---------- PAGE 1 ---------- */
#page1{display:flex;flex-direction:column;justify-content:center;align-items:center}

#logo{width:380px;max-width:80%}

#caption{margin-top:18px;color:#8fd3ff;font-size:22px;z-index:5}

#matrix{
  position:absolute;
  inset:0;
  z-index:1;
  opacity:.25;
}

/* ---------- PAGE 2 ---------- */
#page2{background:black}

/* Coin Rain */
#rain{position:absolute;inset:0}

.coin{
  position:absolute;
  width:96px;
  height:96px;
  background-size:contain;
  background-repeat:no-repeat;
  animation:fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-120px) rotateY(0deg)}
  to{transform:translateY(110vh) rotateY(720deg)}
}

/* Socials */
.socials{
  position:fixed;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:14px;
  z-index:20;
}
.socials a{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,.08);
}
.socials img{width:22px;height:22px}
</style>
</head>

<body>

<div class="socials">
<a href="https://t.me/SATDNAI" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
<a href="https://www.tiktok.com/@satoshidnaai" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png"></a>
<a href="https://www.youtube.com/@SATDNAI" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>
<a href="https://x.com/SatoDnaAi" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968830.png"></a>
<a href="https://www.instagram.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"></a>
</div>

<!-- PAGE 1 -->
<section id="page1">
  <canvas id="matrix"></canvas>
  <img id="logo" src="logo.jpg">
  <div id="caption">Coming Soon on the Blockchain</div>
</section>

<!-- PAGE 2 -->
<section id="page2">
  <div id="rain"></div>
</section>

<script>
// MATRIX EFFECT
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener("resize",resize);

const letters="01SATDNAIΞ₿";
const font=18;
let drops=new Array(Math.floor(innerWidth/font)).fill(1);

setInterval(()=>{
  ctx.fillStyle="rgba(0,0,0,.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ff99";
  ctx.font=font+"px monospace";
  for(let i=0;i<drops.length;i++){
    const char=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(char,i*font,drops[i]*font);
    if(drops[i]*font>canvas.height && Math.random()>.975) drops[i]=0;
    drops[i]++;
  }
},33);

// COIN RAIN
const icons=[
 "https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg",
 "https://cryptologos.cc/logos/ethereum-eth-logo.svg",
 "https://cryptologos.cc/logos/solana-sol-logo.svg",
 "https://cryptologos.cc/logos/binance-coin-bnb-logo.svg",
 "https://cryptologos.cc/logos/cardano-ada-logo.svg"
];

const rain=document.getElementById("rain");

function spawn(){
  const c=document.createElement("div");
  c.className="coin";
  c.style.left=Math.random()*100+"vw";
  c.style.animationDuration=3+Math.random()*3+"s";
  c.style.backgroundImage=url(${icons[Math.floor(Math.random()*icons.length)]});
  rain.appendChild(c);
  setTimeout(()=>c.remove(),7000);
}

setInterval(spawn,80);
</script>

</body>
</html>
