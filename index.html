<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI | Official Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --matrix-green: #00FF41;
            --gold: #FFD700;
            --solana: #00ffa3;
        }

        body, html { 
            margin: 0; padding: 0; 
            background: #000; /* پس‌زمینه سیاه مطلق */
            color: white; 
            font-family: 'Orbitron', sans-serif; 
            overflow: hidden; 
        }

        /* نوار قیمت بالا */
        .price-ticker {
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid var(--matrix-green);
            padding: 5px 0;
            position: fixed;
            top: 0; z-index: 2000;
            white-space: nowrap;
            overflow: hidden;
        }
        .ticker-content {
            display: inline-block;
            animation: ticker 40s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ticker-content span { margin-right: 50px; font-size: 0.8rem; color: var(--solana); }

        /* هیرو سکشن */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* نگهدارنده لوگو و ماتریکس */
        .visual-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* لوگوی ۱۰۰٪ شفاف در لایه زیرین */
        .main-logo {
            position: absolute;
            width: 500px; /* تنظیم سایز لوگو طبق عکس */
            z-index: 1;
            /* حفظ کیفیت اصلی بدون دستکاری رنگ */
            user-select: none;
            pointer-events: none;
        }

        /* ماتریکس در لایه رویی */
        #matrixCanvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            /* ماتریکس روی لوگو ببارد اما لوگو کاملا شفاف بماند */
            mix-blend-mode: lighten; 
        }

        /* متن پایین صفحه */
        .footer-text {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .footer-text p {
            color: var(--matrix-green);
            letter-spacing: 10px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.2rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="price-ticker">
        <div class="ticker-content">
            <span>BTC: $68,432.21</span> <span>ETH: $3,542.10</span> <span>SOL: $145.65</span> 
            <span>SATOSHI DNA AI: $0.00001 (PRE-SALE)</span> <span>BNB: $590.12</span>
        </div>
    </div>

    <section class="hero-section">
        <div class="visual-container">
            <img src="logo.png" alt="Logo" class="main-logo">
            
            <canvas id="matrixCanvas"></canvas>
        </div>

        <div class="footer-text">
            <p>DECENTRALIZED INTELLIGENCE</p>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', init);
        init();

        // کاراکترها به سه زبان طبق عکس ارسالی
        const japanese = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
        const chinese = "龙币人工智能DNA";
        const english = "SATOSHIDNAAI0123456789";
        const allChars = japanese + chinese + english;

        const fontSize = 18;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function draw() {
            // ایجاد افکت محو شدن دنباله‌ها بدون آسیب به سیاهی پس‌زمینه
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const char = allChars.charAt(Math.floor(Math.random() * allChars.length));
                
                // منطق رنگ‌بندی سه زبانه
                if (english.includes(char)) {
                    ctx.fillStyle = "#FFFFFF"; // انگلیسی: سفید
                } else if (chinese.includes(char)) {
                    ctx.fillStyle = "#FFD700"; // چینی: طلایی
                } else {
                    ctx.fillStyle = "#00FF41"; // ژاپنی: سبز ماتریکسی
                }

                ctx.fillText(char, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 50);
    </script>
</body>
</html>
