<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI | Official Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --matrix-green: #00FF41;
            --gold: #FFD700;
            --solana: #00ffa3;
            --dark-bg: #0a0a0a;
        }

        body, html { 
            margin: 0; padding: 0; 
            background: #000; 
            color: white; 
            font-family: 'Orbitron', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden; 
        }

        /* --- Social Sidebar --- */
        .social-sidebar {
            position: fixed; left: 15px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 15px; z-index: 5000;
        }
        .social-item { position: relative; display: flex; align-items: center; }
        .social-icon {
            width: 40px; height: 40px; background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; transition: 0.3s;
        }
        .social-item::after {
            content: attr(data-name); position: absolute; left: 50px;
            background: var(--matrix-green); color: black; padding: 5px 12px;
            border-radius: 4px; font-size: 0.7rem; font-weight: 900;
            opacity: 0; transform: translateX(-10px); transition: 0.3s; pointer-events: none;
        }
        .social-item:hover::after { opacity: 1; transform: translateX(0); }
        .social-icon:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--matrix-green); }

        /* --- Live Price Ticker (30 Tokens) --- */
        .price-ticker {
            width: 100%; background: rgba(0, 20, 0, 0.9); border-bottom: 1px solid var(--matrix-green);
            padding: 8px 0; position: fixed; top: 0; z-index: 2000; overflow: hidden;
        }
        .ticker-wrapper { display: flex; white-space: nowrap; animation: ticker-move 60s linear infinite; }
        @keyframes ticker-move { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .ticker-item { margin-right: 50px; font-size: 0.85rem; color: var(--solana); font-weight: bold; }
        .ticker-item span { color: white; margin-right: 5px; }

        /* --- Navigation --- */
        nav {
            width: 100%; height: 70px; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            position: fixed; top: 35px; display: flex; justify-content: space-between;
            align-items: center; padding: 0 50px; box-sizing: border-box; z-index: 1000;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
        }
        .nav-links a { color: white; text-decoration: none; margin: 0 15px; font-size: 0.75rem; transition: 0.3s; letter-spacing: 1px; }
        .nav-links a:hover { color: var(--matrix-green); }

        /* --- Hero Section --- */
        .hero-section { position: relative; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .main-logo { width: 350px; z-index: 5; filter: drop-shadow(0 0 20px var(--matrix-green)); }
        #matrixCanvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; opacity: 0.6; }

        /* --- Media Grid (Videos & Images) --- */
        .media-container { padding: 100px 5%; background: #050505; text-align: center; }
        .grid-title { color: var(--gold); margin-bottom: 50px; font-size: 2rem; }
        
        .video-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; margin-bottom: 80px; 
        }
        .video-card { 
            position: relative; border: 1px solid #222; border-radius: 8px; overflow: hidden; 
            background: #000; transition: 0.4s;
        }
        .video-card:hover { border-color: var(--matrix-green); transform: translateY(-5); box-shadow: 0 10px 20px rgba(0,255,65,0.2); }
        video { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        .image-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 15px; 
        }
        .img-item { 
            aspect-ratio: 1; border: 1px solid #333; border-radius: 5px; 
            background-size: cover; background-position: center;
            transition: 0.3s; cursor: zoom-in;
        }
        .img-item:hover { transform: scale(1.05); border-color: var(--gold); }

        /* --- Partners Section --- */
        .partners-section { padding: 80px 20px; background: #000; text-align: center; border-top: 1px solid #222; }
        .partner-logos { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; margin-top: 40px; }
        .partner-logos img { height: 40px; filter: grayscale(1) brightness(1.5); transition: 0.3s; }
        .partner-logos img:hover { filter: grayscale(0) brightness(1); }

        /* --- Utility --- */
        .ring-box { display: flex; justify-content: center; gap: 30px; margin: 50px 0; flex-wrap: wrap; }
        .ring { 
            width: 140px; height: 140px; border: 2px solid var(--matrix-green); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
            box-shadow: 0 0 10px var(--matrix-green); background: rgba(0,20,0,0.6);
        }
    </style>
</head>

    <script>
        // Matrix Effect
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        const chars = "010101SATOSHIDNAAIｱｲｳｴｵｶｷ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillStyle = Math.random() > 0.9 ? "#fff" : "#00FF41";
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // Professional Price Ticker (Fetching 30 Tokens)
        async function fetchPrices() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin,ripple,cardano,dogecoin,polkadot,tron,chainlink,polygon,litecoin,shiba-inu,dai,bitcoin-cash,uniswap,avalanche-2,cosmos,stellar,okb,monero,ethereum-classic,filecoin,kaspa,lido-dao,aptos,near,arbitrum,render-token,optimism&vs_currencies=usd');
                const data = await response.json();
                const ticker = document.getElementById('ticker');
                ticker.innerHTML = '';
                
                // Double the list for seamless loop
                const items = Object.entries(data);
                [...items, ...items].forEach(([id, price]) => {
                    const div = document.createElement('div');
                    div.className = 'ticker-item';
                    div.innerHTML = `<span>${id.toUpperCase().replace('-2','')}</span> $${price.usd.toLocaleString()}`;
                    ticker.appendChild(div);
                });
            } catch (e) { console.log("Price fetch error"); }
        }
        fetchPrices();
        setInterval(fetchPrices, 60000); // Update every minute
    </script>
