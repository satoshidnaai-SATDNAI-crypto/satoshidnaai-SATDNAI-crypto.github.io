<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,Helvetica,sans-serif;
}

/* لوگوی اصلی */
.logo-bg{
    position:fixed;
    inset:0;
    background:url("logo.jpg") no-repeat center center;
    background-size: contain;
    z-index:1;
}

/* محافظ ملایم */
.logo-protect{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.05);
    z-index:2;
}

/* ماتریکس */
canvas{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.22;
}

/* باکس متن زیر لوگو */
.caption{
    position:fixed;
    bottom:80px;
    width:100%;
    text-align:center;
    z-index:5;
    animation: float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

/* متن */
.caption span{
    font-size:24px;
    letter-spacing:1px;
    color:#8fd3ff;
}

/* کلمه Solana با استایل رسمی */
.solana{
    font-weight:bold;
    background:linear-gradient(90deg,#00ffa3,#03e1ff,#dc1fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 8px rgba(0,255,163,.4) }
    to{ text-shadow:0 0 18px rgba(3,225,255,.8) }
}
</style>
</head>

<body>

<div class="logo-bg"></div>
<div class="logo-protect"></div>
<canvas id="matrix"></canvas>

<div class="caption">
    <span>Coming Soon on the <span class="solana">Solana</span> Blockchain</span>
</div>

<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

const chars = "01SATDNAIΞ₿ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 18;
let columns = Math.floor(canvas.width / fontSize);
let drops = new Array(columns).fill(1);

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#FFD700";
    ctx.font = fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){
        const char = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(char, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(draw,33);
</script>

</body>
</html>
