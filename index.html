<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w,h,t=0;

function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

// -------- MATRIX BACKGROUND --------
const chars = "01SATDNAICRYPTOSOLANA";
let drops = [];
function initMatrix(){
  const cols = Math.floor(w/16);
  drops = Array(cols).fill(0);
}
initMatrix();

function drawMatrix(){
  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#00ff88";
  ctx.font="16px monospace";
  drops.forEach((y,i)=>{
    const txt = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(txt,i*16,y*16);
    if(y*16>h && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  });
}

// -------- DNA + BITCOIN LOGO --------
function drawDNA(){
  const cx=w/2, cy=h/2;
  const amp=120, spacing=18, len=260;

  for(let i=-len;i<len;i+=spacing){
    const a = t*0.02 + i*0.05;
    const x1 = cx + Math.sin(a)*amp;
    const x2 = cx - Math.sin(a)*amp;
    const y  = cy + i;

    // glowing strands
    ctx.lineWidth=6;
    ctx.strokeStyle="rgba(0,255,160,0.7)";
    ctx.beginPath();
    ctx.moveTo(x1,y);
    ctx.lineTo(x2,y);
    ctx.stroke();

    // particles
    ctx.fillStyle="rgba(0,255,200,0.8)";
    ctx.beginPath();
    ctx.arc(x1,y,2,0,Math.PI*2);
    ctx.arc(x2,y,2,0,Math.PI*2);
    ctx.fill();
  }

  // Golden energy halo
  const g = ctx.createRadialGradient(cx,cy,20,cx,cy,240);
  g.addColorStop(0,"rgba(255,200,0,0.35)");
  g.addColorStop(1,"rgba(255,200,0,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(cx,cy,240,0,Math.PI*2);
  ctx.fill();

  // Bitcoin Symbol ₿
  ctx.font="bold 140px Arial";
  ctx.fillStyle="#ffcc33";
  ctx.shadowColor="#ffb300";
  ctx.shadowBlur=40;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("₿",cx,cy);
}

// -------- LOOP --------
function loop(){
  drawMatrix();
  drawDNA();
  t++;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
