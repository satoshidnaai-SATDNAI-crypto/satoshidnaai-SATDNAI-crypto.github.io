<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATDNAI | Official Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd700;
            --solana-green: #00ffa3;
            --solana-purple: #dc1fff;
            --text-blue: #8fd3ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Rajdhani', sans-serif;
        }

        /* لایه 1: باران ماتریکس در پس‌زمینه */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6; /* شدت دیدن ماتریکس */
        }

        /* لایه 2: محتوای اصلی */
        .main-ui {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* کلیک‌ها از این لایه عبور کنند */
        }

        /* بخش جادویی حذف پس‌زمینه سیاه لوگو */
        .logo-container {
            width: 80%;
            max-width: 600px;
            /* این دستور سیاهی لوگو را حذف کرده و ماتریکس را نشان می‌دهد */
            mix-blend-mode: screen; 
            filter: contrast(1.1) brightness(1.1);
            animation: logoFloat 4s ease-in-out infinite;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* متن پایین صفحه */
        .caption {
            margin-top: 20px;
            text-align: center;
        }

        .caption span {
            font-size: 24px;
            color: var(--text-blue);
            letter-spacing: 1px;
            font-family: 'Orbitron';
        }

        .solana {
            font-weight: bold;
            background: linear-gradient(90deg, var(--solana-green), #03e1ff, var(--solana-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 8px rgba(0,255,163,.4); }
            to { text-shadow: 0 0 18px rgba(3,225,255,.9); }
        }

        /* شبکه‌های اجتماعی */
        .socials {
            position: fixed;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
            pointer-events: auto; /* فعال کردن کلیک روی آیکون‌ها */
        }

        .socials a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .socials a:hover {
            background: var(--solana-green);
            transform: scale(1.2) rotate(10deg);
        }

        .socials img {
            width: 25px;
            height: 25px;
            filter: invert(1); /* سفید کردن آیکون‌ها برای هماهنگی */
        }

    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="main-ui">
        <div class="logo-container">
            <img src="logo.png" alt="SATDNAAI Logo">
        </div>

        <div class="caption">
            <span>Coming Soon on the <span class="solana">Solana</span> Blockchain</span>
        </div>
    </div>

    <div class="socials">
        <a href="https://t.me/SATDNAAI" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
        <a href="https://www.tiktok.com/@satoshidnaai" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png"></a>
        <a href="https://www.youtube.com/@SATDNAI" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>
        <a href="https://x.com/SatoDnaAi" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968830.png"></a>
    </div>

    <script>
        const canvas = document.getElementById("matrixCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        const chars = "01SATDNAIΞ₿$";
        const fontSize = 18;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#FFD700"; // رنگ طلایی برای ماتریکس
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 33);
    </script>
</body>
</html>
