<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,Helvetica,sans-serif;
}

.logo-bg{
    position:fixed;
    inset:0;
    background:url("logo.jpg") no-repeat center center;
    background-size: contain;
    z-index:1;
}

.logo-protect{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.05);
    z-index:2;
}

canvas{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.22;
}

.caption{
    position:fixed;
    bottom:40px;
    width:100%;
    text-align:center;
    z-index:5;
    color:#8fd3ff;
    font-size:24px;
}

.solana{
    font-weight:bold;
    background:linear-gradient(90deg,#00ffa3,#03e1ff,#dc1fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* شبکه‌های اجتماعی */
.socials{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:16px;
    z-index:10;
}

.socials a{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
}

.socials img{
    width:26px;
    height:26px;
}
</style>
</head>

<body>

<div class="logo-bg"></div>
<div class="logo-protect"></div>
<canvas id="matrix"></canvas>

<div class="caption">
    Coming Soon on the <span class="solana">Solana</span> Blockchain
</div>

<div class="socials" id="socials">
    <a href="https://t.me/SATDNAI" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
    <a href="https://www.tiktok.com/@satoshidnaai?is_from_webapp=1&sender_device=pc" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png"></a>
    <a href="https://www.youtube.com/@SATDNAI" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>
    <a href="https://x.com/SatoDnaAi" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968830.png"></a>
</div>

<script>
const icons = document.querySelectorAll('#socials a');

icons.forEach((icon, i) => {
    let scale = 1;
    let growing = true;

    setInterval(() => {
        if(growing){
            scale += 0.015;
            if(scale >= 1.12) growing = false;
        } else {
            scale -= 0.015;
            if(scale <= 1) growing = true;
        }
        icon.style.transform = scale(${scale});
    }, 30);

    icon.addEventListener('mouseenter', () => {
        icon.style.transform = 'scale(1.3)';
    });
    icon.addEventListener('mouseleave', () => {
        scale = 1;
        growing = true;
    });
});

// ماتریکس
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

const chars = "01SATDNAIΞ₿ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 18;
let columns = Math.floor(canvas.width / fontSize);
let drops = new Array(columns).fill(1);

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#FFD700";
    ctx.font = fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){
        const char = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(char, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(draw,33);
</script>

</body>
</html>
