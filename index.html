<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATDNAAI | Golden Triple Circles</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Orbitron', sans-serif;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .nav-links a {
            color: #ffd700;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .buy-now {
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .buy-now:hover {
            background: #ffd700;
            color: black;
            box-shadow: 0 0 20px #ffd700;
        }

        /* بخش سه دایره */
        .hero {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .circle-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .gold-circle {
            width: 160px;
            height: 160px;
            border: 3px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            color: #ffd700;
            font-size: 1.2rem;
            font-weight: 900;
            text-align: center;
            transition: 0.5s;
        }

        .gold-circle:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            background: rgba(255, 215, 0, 0.1);
        }

        .plus-sign {
            color: #ffd700;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ffd700;
        }

        .main-title {
            margin-top: 50px;
            color: white;
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .sub-text {
            color: #888;
            margin-top: 10px;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="content-layer">
        <nav>
            <div style="color: #ffd700; font-size: 1.5rem; font-weight: 900;">SATDNAAI</div>
            <div class="nav-links">
                <a href="#">ABOUT</a>
                <a href="#">HOW TO BUY</a>
                <a href="#">TOKENOMICS</a>
                <a href="#">WHITEPAPER</a>
            </div>
            <a href="#" class="buy-now">BUY NOW</a>
        </nav>

        <div class="hero">
            <div class="circle-container">
                <div class="gold-circle">SATOSHI</div>
                
                <div class="plus-sign">+</div>
                
                <div class="gold-circle">DNA</div>
                
                <div class="plus-sign">+</div>
                
                <div class="gold-circle">AI</div>
            </div>

            <h1 class="main-title">Welcome to Satoshidnaai</h1>
            <p class="sub-text">GUARDIAN OF THE DIGITAL EVOLUTION</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "01";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#003300"; // سبز تیره ماتریکسی
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
