<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* پس‌زمینه */
.logo-bg{
    position:fixed;
    inset:0;
    background:url("logo.jpg") no-repeat center center;
    background-size:contain;
}

/* متن */
.caption{
    position:fixed;
    left:40px;
    top:50%;
    transform:translateY(-50%);
    color:white;
}

.caption h1{font-size:64px}
.caption p{font-size:18px;color:#7fd3ff}

/* پنل قیمت */
.price-panel{
    position:fixed;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.55);
    border:1px solid rgba(0,255,200,0.3);
    border-radius:12px;
    padding:10px 14px;
    width:150px;
    backdrop-filter:blur(8px);
}

.price-item{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
    font-size:13px;
    color:#ddd;
    transition:0.3s;
}

.price-up span{color:#00ff99}
.price-down span{color:#ff4d4d}
</style>
</head>

<body>

<div class="logo-bg"></div>

<div class="caption">
    <h1>SATDNAI</h1>
    <p>Coming Soon on the Solana Blockchain</p>
</div>

<div class="price-panel" id="pricePanel">Loading...</div>

<script>
const coins={
 bitcoin:"BTC",
 ethereum:"ETH",
 binancecoin:"BNB",
 ripple:"XRP",
 solana:"SOL",
 dogecoin:"DOGE"
};

let lastPrices={};

async function loadPrices(){
 try{
  const ids=Object.keys(coins).join(",");
  const res=await fetch(https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd);
  const data=await res.json();

  const panel=document.getElementById("pricePanel");
  panel.innerHTML="";

  for(const id in coins){
    const newPrice=data[id].usd;
    const oldPrice=lastPrices[id]||newPrice;

    let cls="";
    if(newPrice>oldPrice) cls="price-up";
    if(newPrice<oldPrice) cls="price-down";

    panel.innerHTML+=
      <div class="price-item ${cls}">
        ${coins[id]}
        <span>$${newPrice}</span>
      </div>
    ;

    lastPrices[id]=newPrice;
  }
 }catch{
  document.getElementById("pricePanel").innerText="Loading...";
 }
}

loadPrices();
setInterval(loadPrices,15000);
</script>

</body>
</html>
