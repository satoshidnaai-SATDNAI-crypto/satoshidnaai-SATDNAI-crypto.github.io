<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DNA Bitcoin</title>
<style>
html,body{
    margin:0;
    padding:0;
    background:black;
    overflow:hidden;
}
canvas{display:block}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<script>
const c = document.getElementById("cv");
const ctx = c.getContext("2d");

function resize(){
    c.width = innerWidth;
    c.height = innerHeight;
}
window.addEventListener("resize", resize);
resize();

let t = 0;

function draw(){
    ctx.clearRect(0,0,c.width,c.height);

    const cx = c.width/2;
    const cy = c.height/2;

    for(let i=-300;i<300;i++){
        const y = i*3;
        const a = i*0.15 + t;
        const x = Math.sin(a)*120;

        // glow
        ctx.strokeStyle = "rgba(0,255,120,0.3)";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(cx+x, cy+y);
        ctx.lineTo(cx-x, cy+y);
        ctx.stroke();

        // core
        ctx.strokeStyle = "rgb(0,255,0)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx+x, cy+y);
        ctx.lineTo(cx-x, cy+y);
        ctx.stroke();

        // particles
        ctx.fillStyle = "rgba(0,255,0,0.6)";
        ctx.fillRect(cx+x-2, cy+y-2, 3, 3);
        ctx.fillRect(cx-x-2, cy+y-2, 3, 3);
    }

    // Bitcoin symbol
    ctx.font = "bold 140px Arial";
    ctx.fillStyle = "gold";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "gold";
    ctx.shadowBlur = 40;
    ctx.fillText("₿", cx, cy);
    ctx.shadowBlur = 0;

    t += 0.03;
    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
