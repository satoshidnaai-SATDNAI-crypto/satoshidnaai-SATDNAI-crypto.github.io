<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI | ADVANCED DNA MATRIX</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #matrix { position: fixed; inset: 0; z-index: 1; }

    .content-overlay {
        position: relative;
        z-index: 10;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }

    /* حذف ۱۰۰٪ پس‌زمینه سیاه لوگو با متد Screen */
    .logo-box {
        width: 550px;
        mix-blend-mode: screen; 
        filter: contrast(1.2) brightness(1.2);
        animation: dna-float 4s ease-in-out infinite;
    }

    .logo-box img { width: 100%; height: auto; }

    @keyframes dna-float {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0,255,163,0.2)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 30px rgba(0,212,255,0.4)); }
    }

    .caption {
        margin-top: 25px;
        font-family: 'Orbitron', sans-serif;
        font-size: 24px;
        color: #8fd3ff;
        text-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
        letter-spacing: 3px;
    }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="content-overlay">
    <div class="logo-box">
        <img src="logo.png" alt="SATDNAI">
    </div>
    <div class="caption">
        <span>COMING SOON ON SOLANA</span>
    </div>
</div>

<script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    let width, height, columns;
    const fontSize = 16;
    
    // دقیقاً همان کاراکترهای تصویر مد نظر شما (ژاپنی، چینی، انگلیسی و نمادها)
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~Ξ₿";
    
    let frame = 0;

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        columns = Math.floor(width / fontSize);
    }

    function draw() {
        // ایجاد دنباله نوری (Trail) غلیظ
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, width, height);

        ctx.font = fontSize + "px monospace";
        frame++;

        for (let i = 0; i < columns; i++) {
            // ایجاد فرم مارپیچ DNA (Double Helix)
            const y1 = (Math.sin(frame * 0.04 + i * 0.15) * 150) + (height / 2);
            const y2 = (Math.sin(frame * 0.04 + i * 0.15 + Math.PI) * 150) + (height / 2);

            // انتخاب کاراکتر رندوم
            const char1 = chars[Math.floor(Math.random() * chars.length)];
            const char2 = chars[Math.floor(Math.random() * chars.length)];

            // افکت درخشش لبه‌ها (Glow)
            ctx.shadowBlur = (Math.random() > 0.9) ? 10 : 0;
            ctx.shadowColor = "#00ff41";

            // رسم رشته اول (سبز ماتریکسی متراکم)
            ctx.fillStyle = (Math.random() > 0.95) ? "#fff" : "#00ff41";
            ctx.fillText(char1, i * fontSize, y1 + (Math.random() * 80 - 40));

            // رسم رشته دوم (طلایی/آبی متراکم)
            ctx.fillStyle = (i % 2 === 0) ? "#FFD700" : "#00d4ff";
            ctx.fillText(char2, i * fontSize, y2 + (Math.random() * 80 - 40));
        }
    }

    window.addEventListener("resize", init);
    init();
    setInterval(draw, 33);
</script>
</body>
</html>
