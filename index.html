<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SATDNAI 3D Logo</title>
<style>
body { margin:0; background:black; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 6;

let renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
let light = new THREE.PointLight(0x00ffff, 1);
light.position.set(3, 2, 5);
scene.add(light);

// Load texture
let texture = new THREE.TextureLoader().load("satdnaai.png");

// Logo plane
let geo = new THREE.PlaneGeometry(4, 4);
let mat = new THREE.MeshStandardMaterial({
  map: texture,
  transparent: true,
  metalness: 0.8,
  roughness: 0.25
});
let logo = new THREE.Mesh(geo, mat);
scene.add(logo);

// Animate
function animate(){
  requestAnimationFrame(animate);
  logo.rotation.y += 0.01;
  logo.rotation.x += 0.004;
  renderer.render(scene, camera);
}
animate();

// Resize
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
