<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHIDNAAI | Ultra Pro Matrix AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --matrix-green: #00FF41;
            --matrix-bright: #00FF9D;
            --matrix-dark: #003B00;
            --matrix-black: #050505;
            --matrix-glow: rgba(0, 255, 65, 0.6);
            --matrix-text: #D1FFD1;
            --neon-blue: #00F3FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--matrix-black);
            color: var(--matrix-text);
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
        }

        /* Matrix Background - Enhanced Clarity */
        #matrix-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5; /* افزایش شفافیت برای وضوح بیشتر */
        }

        /* Header & Logo Fix */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--matrix-green);
            padding: 10px 40px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 50px; /* تنظیم اندازه لوگو */
            width: auto;
            filter: drop-shadow(0 0 5px var(--matrix-green));
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--matrix-green);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--matrix-glow);
        }

        /* Hero Video Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .main-video-container {
            width: 80%;
            max-width: 900px;
            border: 2px solid var(--matrix-green);
            box-shadow: 0 0 30px var(--matrix-glow);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 5rem);
            background: linear-gradient(90deg, #fff, var(--matrix-green), var(--neon-blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px var(--matrix-glow);
        }

        /* Video Cards Fix */
        .video-card {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid var(--matrix-green);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.4s;
        }

        .video-card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px var(--matrix-glow);
        }

        .video-thumb {
            width: 100%;
            height: 200px;
            object-fit: cover; /* باعث می‌شود عکس‌ها دفرمه نشوند */
            border-bottom: 1px solid var(--matrix-green);
        }

        .connect-btn {
            background: var(--matrix-green);
            color: black;
            padding: 12px 25px;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron';
            transition: 0.3s;
        }

        .connect-btn:hover {
            box-shadow: 0 0 20px var(--matrix-green);
            transform: translateY(-2px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 50px 40px;
        }
    </style>
</head>
<body>

    <canvas id="matrix-background"></canvas>

    <header class="header">
        <div class="logo-box">
            <img src="logo.png" alt="SATOSHIDNAAI Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">SATOSHI DNA AI</span>
        </div>
        <button class="connect-btn">CONNECT WALLET</button>
    </header>

    <section class="hero">
        <div class="main-video-container">
            <video width="100%" autoplay muted loop>
                <source src="SATOSHIDNAAI.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <h1 class="hero-title">BEYOND THE MATRIX</h1>
        <p style="letter-spacing: 5px; color: var(--matrix-bright);">DECENTRALIZED ARTIFICIAL INTELLIGENCE</p>
    </section>

    <h2 style="text-align: center; font-family: 'Orbitron'; color: var(--matrix-green); font-size: 2.5rem;">DATA TERMINAL</h2>

    <section class="grid-container">
        <div class="video-card">
            <img src="jpg1.jpg" class="video-thumb" alt="AI Core">
            <div style="padding: 15px;">
                <h3>Neural Network v1.0</h3>
                <p>Analyzing blockchain DNA blocks in real-time.</p>
            </div>
        </div>

        <div class="video-card">
            <img src="jpg2.jpg" class="video-thumb" alt="Market Analysis">
            <div style="padding: 15px;">
                <h3>Market Intelligence</h3>
                <p>Predictive AI for crypto market fluctuations.</p>
            </div>
        </div>

        <div class="video-card">
            <img src="jpg3.jpg" class="video-thumb" alt="Security">
            <div style="padding: 15px;">
                <h3>Quantum Security</h3>
                <p>Encrypted nodes protecting decentralized assets.</p>
            </div>
        </div>
    </section>

    <script>
        // Enhanced Matrix Effect
        const canvas = document.getElementById('matrix-background');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "0101010101ABCDEFGHIJKLMNOPQRSTUVWXYZｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px 'JetBrains Mono'";
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                
                // ایجاد درخشش متغیر برای وضوح بیشتر
                ctx.fillStyle = Math.random() > 0.9 ? "#FFF" : "#00FF41"; 
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
