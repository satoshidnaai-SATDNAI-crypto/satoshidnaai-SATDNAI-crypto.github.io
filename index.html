<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI Logo</title>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:black;
    font-family: 'Segoe UI', sans-serif;
}

.logo{
    display:flex;
    font-size:120px;
    font-weight:800;
    letter-spacing:4px;
}

.white{
    color:white;
    text-shadow:0 0 15px rgba(255,255,255,.3);
}

.blue{
    color:#00aaff;
    text-shadow:
        0 0 10px #00aaff,
        0 0 20px #0099ff,
        0 0 40px #0077ff;
}

.ai{
    position:relative;
    background:linear-gradient(135deg,#00e1ff,#0050ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:
        0 0 20px rgba(0,200,255,.7),
        0 0 40px rgba(0,100,255,.6);
}

.ai::after{
    content:"";
    position:absolute;
    inset:-15px;
    background:radial-gradient(circle,rgba(0,180,255,.25),transparent 60%);
    filter:blur(15px);
    z-index:-1;
}
</style>
</head>
<body>

<div class="logo">
    <span class="white">SAT</span>
    <span class="blue">DNA</span>
    <span class="ai">AI</span>
</div>

</body>
</html>
