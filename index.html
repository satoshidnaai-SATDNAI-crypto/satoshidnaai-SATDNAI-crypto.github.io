<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

/* لایه لوگوی اصلی */
.logo-bg{
    position:fixed;
    inset:0;
    background:url("logo.jpg") no-repeat center center;
    background-size: contain;
    z-index:1;
}

/* لایه افزایش وضوح بدون بلور */
.logo-clear{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.15);
    z-index:2;
}

/* افکت ماتریکس */
canvas{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.25;
}

/* نور سینمایی اطراف لوگو */
.glow{
    position:fixed;
    inset:0;
    background:radial-gradient(circle, rgba(0,255,200,.55), transparent 55%);
    z-index:4;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="logo-bg"></div>
<div class="logo-clear"></div>
<canvas id="matrix"></canvas>
<div class="glow"></div>

<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

const chars = "01SATDNAIΞ₿ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const size = 18;
let columns;
let drops;

function init(){
    columns = Math.floor(canvas.width/size);
    drops = new Array(columns).fill(1);
}
init();

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ff88";
    ctx.font = size + "px monospace";

    for(let i=0;i<drops.length;i++){
        const text = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(text,i*size,drops[i]*size);
        if(drops[i]*size > canvas.height && Math.random() > 0.975){
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(draw,33);
</script>

</body>
</html>
