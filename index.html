[17:06, 18.1.2026] Ahmad: <!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Ryujin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    background: radial-gradient(circle at top, #f7d9c4, #e7b18a);
    min-height:100vh;
    overflow-x:hidden;
}

/* ---------- HEADER ---------- */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 60px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:22px;
}

.logo img{
    width:40px;
}

nav a{
    margin:0 15px;
    text-decoration:none;
    color:#222;
    font-weight:500;
}

.buy-btn{
    padding:10px 22px;
    border:2px solid #222;
    background:none;
    cursor:pointer;
    font-weight:600;
}

/* ---------- HERO ---------- */
.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:80px 60px;
}

.hero-text{
    max-width:550px;
}

.hero-text h1{
    font-size:64px;
    font-weight:800;
    line-height:1.1;
    color:#e16b2e;
}

.hero-text p{
    margin:25px 0;
    font-size:18px;
    color:#333;
}

.hero-text .cta{
    background:#e16b2e;
    color:white;
    border:none;
    padding:15px 35px;
    font-size:16px;
    cursor:pointer;
    border-radius:4px;
}

/* ---------- CIRCLE ART ---------- */
.hero-art{
    position:relative;
    width:420px;
    height:420px;
    border-radius:50%;
    background:linear-gradient(145deg,#f3b98c,#d68b5b);
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-art::before{
    content:'';
    position:absolute;
    width:85%;
    height:85%;
    border-radius:50%;
    background:#fff5eb;
}

/* ---------- SOCIAL ---------- */
.social{
    position:fixed;
    left:30px;
    bottom:40px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.social a{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#e16b2e;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-weight:bold;
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:900px){
    .hero{
        flex-direction:column;
        text-align:center;
    }
    .hero-art{
        margin-top:40px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Dragon_icon.svg/512px-Dragon_icon.svg.png">
        RYUJIN
    </div>

    <nav>
        <a href="#">ABOUT</a>
        <a href="#">HOW TO BUY</a>
        <a href="#">TOKENOMICS</a>
        <a href="#">WHITEPAPER</a>
    </nav>

    <button class="buy-btn">BUY NOW</button>
</header>

<section class="hero">
    <div class="hero-text">
        <h1>Welcome to Ryujin</h1>
        <p>
            Guardian of Omikami Ecosystem.  
            A new generation crypto experience inspired by Japanese mythology.
        </p>
        <button class="cta">Get Started</button>
    </div>

    <div class="hero-art">
        <!-- جای تصویر یا SVG -->
    </div>
</section>

<div class="social">
    <a href="#">T</a>
    <a href="#">X</a>
    <a href="#">D</a>
</div>

</body>
</html>
