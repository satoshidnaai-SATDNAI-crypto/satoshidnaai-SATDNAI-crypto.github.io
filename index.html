<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه ماتریکس و کریپتو</title>
    <style>
        /* تنظیمات کلی برای اسکرول نرم و چسبنده */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            scroll-behavior: smooth;
            overflow-x: hidden;
            background-color: #000;
            font-family: 'Tahoma', sans-serif;
        }

        /* ظرف اصلی برای اسکرول اسنپ */
        .container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; /* مجبور کردن اسکرول به ایستادن روی بخش‌ها */
        }

        section {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start; /* هر بخش در ابتدای صفحه قفل می‌شود */
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* --- استایل بخش اول: ماتریکس --- */
        #section1 { background: black; }
        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }
        .overlay {
            z-index: 2;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 2rem;
            border: 2px solid #0f0;
            border-radius: 15px;
        }

        /* --- استایل بخش دوم: قیمت ارزها --- */
        #section2 {
            background: #1a1a1a;
            justify-content: flex-start;
        }
        .crypto-bar {
            width: 100%;
            background: #222;
            padding: 20px 0;
            display: flex;
            justify-content: space-around;
            border-bottom: 3px solid #333;
            font-size: 1.2rem;
        }
        .coin-box { text-align: center; }
        .price { color: #f1c40f; font-weight: bold; }
        .up { color: #2ecc71; }
        .down { color: #e74c3c; }

        /* --- استایل بخش سوم: لوگوی بیت‌کوین --- */
        #section3 {
            background: radial-gradient(circle, #4b2c00 0%, #000000 100%);
        }
        .btc-logo {
            font-size: 180px;
            color: #f39c12;
            text-shadow: 0 0 60px #f39c12;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #888;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

<div class="container">
    
    <section id="section1">
        <canvas id="matrixCanvas"></canvas>
        <div class="overlay">
            <h1>سیستم مرکزی ماتریکس</h1>
            <p>برای مشاهده بازار به پایین اسکرول کنید</p>
        </div>
        <div class="scroll-hint">▼ اسکرول کنید</div>
    </section>

    <section id="section2">
        <div class="crypto-bar">
            <div class="coin-box">Bitcoin Cash<br><span class="price">$654.52</span> <small class="up">+2.74%</small></div>
            <div class="coin-box">Dogecoin<br><span class="price">$0.14</span> <small class="down">-0.02%</small></div>
            <div class="coin-box">TRON<br><span class="price">$0.12</span> <small class="up">+0.5%</small></div>
        </div>
        <div style="margin-top: 100px; text-align: center;">
            <h2>وضعیت لحظه‌ای بازار دیجیتال</h2>
            <p>داده‌ها بر اساس عکس شماره ۲ شبیه‌سازی شده‌اند.</p>
        </div>
        <div class="scroll-hint">▼ جزئیات بیشتر</div>
    </section><section id="section3">
        <div class="btc-logo">₿</div>
        <h1>تحلیل نهایی</h1>
        <p>امنیت و سرعت در شبکه بلاک‌چین</p>
    </section>

</div>

<script>
    // اسکریپت باران ماتریکسی برای بخش اول
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#%*";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = characters.charAt(Math.floor(Math.random() * characters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 35);
</script>

</body>
</html>
