<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Social Landing Page</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

*{
    box-sizing: border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top, #0f172a, #020617);
    font-family: 'Poppins', sans-serif;
}

/* کارت مرکزی */
.card{
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    padding: 35px 40px;
    border-radius: 24px;
    box-shadow:
      0 10px 40px rgba(0,0,0,.6),
      inset 0 0 40px rgba(255,255,255,.03);
    text-align:center;
    min-width: 320px;
}

/* عنوان بالای صفحه */
.card h2{
    color:white;
    margin-top:0;
    margin-bottom:20px;
    letter-spacing: .5px;
}

/* ردیف آیکن‌ها */
.social-icons{
    display:flex;
    justify-content:center;
    gap: 18px;
}

/* استایل پایه آیکن */
.icon{
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size: 26px;
    color:white;
    text-decoration:none;
    position: relative;
    overflow:hidden;
    transition: transform .3s, box-shadow .3s;
}

/* افکت نور شیشه‌ای */
.icon::after{
    content:"";
    position:absolute;
    top:-5px;
    left:15%;
    width:70%;
    height:40%;
    background: rgba(255,255,255,.25);
    filter: blur(6px);
    border-radius: 50%;
}

/* هاله نور اطراف */
.icon::before{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:50%;
    filter: blur(8px);
    opacity:.5;
}

/* رنگ هر شبکه */
.youtube{ background:#FF0000; }
.youtube::before{ background:#FF0000; }

.twitter{ background:#1DA1F2; }
.twitter::before{ background:#1DA1F2; }

.tiktok{ background:#111; }
.tiktok::before{ background:#444; }

.instagram{
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}
.instagram::before{
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}

.telegram{ background:#0088cc; }
.telegram::before{ background:#0088cc; }

/* انیمیشن ورود از پایین (مثل طرح تو) */
.icon{
    animation: popUp .8s ease forwards;
    opacity:0;
}

.icon:nth-child(1){ animation-delay:.1s;}
.icon:nth-child(2){ animation-delay:.2s;}
.icon:nth-child(3){ animation-delay:.3s;}
.icon:nth-child(4){ animation-delay:.4s;}
.icon:nth-child(5){ animation-delay:.5s;}

@keyframes popUp{
    from{
        transform: translateY(40px) scale(.8);
        opacity:0;
    }
    to{
        transform: translateY(0) scale(1);
        opacity:1;
    }
}

/* هاور افکت */
.icon:hover{
    transform: translateY(-8px) scale(1.05);
    box-shadow: 0 15px 25px rgba(0,0,0,.5);
}
</style>
</head>

<body>

<div class="card">
  <h2>Follow Us</h2>

  <div class="social-icons">

    <a class="icon youtube" href="https://www.youtube.com" target="_blank">
      <i class="fa-brands fa-youtube"></i>
    </a>

    <a class="icon twitter" href="https://twitter.com" target="_blank">
      <i class="fa-brands fa-twitter"></i>
    </a>

    <a class="icon tiktok" href="https://www.tiktok.com" target="_blank">
      <i class="fa-brands fa-tiktok"></i>
    </a>

    <a class="icon instagram" href="https://www.instagram.com" target="_blank">
      <i class="fa-brands fa-instagram"></i>
    </a>

    <a class="icon telegram" href="https://t.me" target="_blank">
      <i class="fa-brands fa-telegram"></i>
    </a>

  </div>
</div>

</body>
</html>
