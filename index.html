<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Crypto Fireworks Animation</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// لیست توکن‌هایی که جایگزین آتش‌بازی می‌شوند
const cryptoIcons = ['₿', 'Ξ', '₮', 'XRP', 'ADA', 'SOL', 'DOGE'];
const colors = ['#F7931A', '#627EEA', '#26A17B', '#23292F', '#0033AD', '#14F195', '#C2A633'];

let particles = [];

class Particle {
    constructor(x, y, color, icon, velocity) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.icon = icon;
        this.velocity = velocity;
        this.alpha = 1;
        this.friction = 0.95;
        this.gravity = 0.15;
        this.life = Math.random() * 60 + 40;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.font = '20px Arial';
        ctx.fillText(this.icon, this.x, this.y);
        ctx.restore();
    }

    update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.01;
        this.life--;
    }
}

function createFirework(x, y) {
    const iconIndex = Math.floor(Math.random() * cryptoIcons.length);
    const icon = cryptoIcons[iconIndex];
    const color = colors[iconIndex];
    
    // تعداد ذرات (توکن‌ها) در هر انفجار
    const particleCount = 20;
    const angleIncrement = (Math.PI * 2) / particleCount;

    for (let i = 0; i < particleCount; i++) {
        const velocity = {
            x: Math.cos(angleIncrement * i) * (Math.random() * 6 + 2),
            y: Math.sin(angleIncrement * i) * (Math.random() * 6 + 2)
        };
        particles.push(new Particle(x, y, color, icon, velocity));
    }
}

// ایجاد انفجار با کلیک موس
window.addEventListener('click', (event) => {
    createFirework(event.clientX, event.clientY);
});

// ایجاد انفجار خودکار
setInterval(() => {
    const x = Math.random() * canvas.width;
    const y = Math.random() * (canvas.height / 2);
    createFirework(x, y);
}, 1000);

function animate() {
    requestAnimationFrame(animate);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // افکت کشیدگی (Trail)
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach((particle, index) => {
        if (particle.alpha > 0 && particle.life > 0) {
            particle.update();
            particle.draw();
        } else {
            particles.splice(index, 1);
        }
    });
}

animate();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
