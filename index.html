<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI — Crypto AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:black;color:white;overflow:hidden}

/* MATRIX */
canvas{position:fixed;top:0;left:0;z-index:-2}

/* SCROLL */
.wrapper{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory}
.section{height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px}

/* HEADLINES */
h1{font-size:64px}
h2{font-size:42px}

/* GOLD BTC */
.btc{font-size:120px;color:gold;text-shadow:0 0 25px gold,0 0 60px orange}

/* NAV */
.nav{position:fixed;top:20px;right:30px;z-index:5}
.nav a{color:white;text-decoration:none;margin-left:20px;font-weight:bold}
.nav a:hover{color:#00ffff}

/* MARKET TICKER */
.ticker-wrap{
  width:100%;
  overflow:hidden;
  background:rgba(0,0,0,.7);
  border-top:1px solid rgba(0,255,255,.4);
  border-bottom:1px solid rgba(0,255,255,.4);
  padding:10px 0;
  margin-top:40px;
}
.ticker{
  display:flex;
  gap:40px;
  white-space:nowrap;
  animation:scroll 30s linear infinite;
}
.ticker div{
  font-weight:bold;
  font-size:18px;
}
@keyframes scroll{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* ROADMAP */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;width:90%;max-width:1000px;margin-top:40px}
.card{background:rgba(0,0,0,.7);border:1px solid rgba(0,255,255,.4);border-radius:14px;padding:24px;box-shadow:0 0 30px rgba(0,255,255,.2)}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="nav">
<a href="#home">Home</a>
<a href="#market">Market</a>
<a href="#roadmap">Roadmap</a>
</div>

<div class="wrapper">

<section id="home" class="section">
<h1>SATDNAI</h1>
<p>Satoshi Reborn with Artificial Intelligence</p>
<div class="btc">₿</div>
</section>

<section id="market" class="section">
<h2>Live Crypto Market</h2>

<div class="ticker-wrap">
  <div class="ticker" id="ticker"></div>
</div>

</section>

<section id="roadmap" class="section">
<h2>Roadmap 2026</h2>
<div class="cards">
  <div class="card">Q1 — Token Launch</div>
  <div class="card">Q2 — Exchange Listings</div>
  <div class="card">Q3 — AI Ecosystem</div>
  <div class="card">Q4 — Global Expansion</div>
</div>
</section>

</div>

<script>
// MATRIX EFFECT
const c=document.getElementById("matrix"),ctx=c.getContext("2d");
c.width=window.innerWidth;c.height=window.innerHeight;
let letters="01".split(""),font=14,cols=c.width/font,drops=[];
for(let i=0;i<cols;i++)drops[i]=1;
function draw(){
 ctx.fillStyle="rgba(0,0,0,.05)";
 ctx.fillRect(0,0,c.width,c.height);
 ctx.fillStyle="#00ff99";
 ctx.font=font+"px monospace";
 for(let i=0;i<drops.length;i++){
  let text=letters[Math.floor(Math.random()*letters.length)];
  ctx.fillText(text,i*font,drops[i]*font);
  if(drops[i]*font>c.height&&Math.random()>0.975)drops[i]=0;
  drops[i]++;
 }
}
setInterval(draw,33);

// LIVE TICKER
async function loadMarket(){
 const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin,cardano,polkadot&vs_currencies=usd");
 const d=await r.json();
 const t=document.getElementById("ticker");
 t.innerHTML=`
 <div>BTC $${d.bitcoin.usd}</div>
 <div>ETH $${d.ethereum.usd}</div>
 <div>SOL $${d.solana.usd}</div>
 <div>BNB $${d.binancecoin.usd}</div>
 <div>ADA $${d.cardano.usd}</div>
 <div>DOT $${d.polkadot.usd}</div>
 `;
}
loadMarket();
setInterval(loadMarket,10000);
</script>

</body>
</html>
