<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
}

canvas{
  position:fixed;
  inset:0;
}

#logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:480px;
  z-index:3;
  animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{
  0%{filter:drop-shadow(0 0 25px #00ff99)}
  50%{filter:drop-shadow(0 0 60px #00ffd5)}
  100%{filter:drop-shadow(0 0 25px #00ff99)}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<canvas id="particles"></canvas>
<img src="logo.png" id="logo">

<script>
/* MATRIX */
const m = document.getElementById("matrix");
const mtx = m.getContext("2d");
m.width=innerWidth; m.height=innerHeight;

const letters = "01 SATDNAI AI BLOCKCHAIN SOLANA CRYPTO";
const fontSize = 18;
const columns = m.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix(){
  mtx.fillStyle="rgba(0,0,0,0.05)";
  mtx.fillRect(0,0,m.width,m.height);

  mtx.fillStyle="#00ff99";
  mtx.font=fontSize+"px monospace";

  for(let i=0;i<drops.length;i++){
    const text = letters[Math.floor(Math.random()*letters.length)];
    mtx.fillText(text, i*fontSize, drops[i]*fontSize);

    if(drops[i]*fontSize > m.height && Math.random()>0.975)
      drops[i]=0;
    drops[i]++;
  }
}

/* PARTICLES */
const p = document.getElementById("particles");
const px = p.getContext("2d");
p.width=innerWidth; p.height=innerHeight;

const sparks=[];
for(let i=0;i<160;i++){
  sparks.push({
    x:Math.random()*p.width,
    y:Math.random()*p.height,
    v:Math.random()*0.6+0.2,
    s:Math.random()*2+0.5
  });
}

function drawParticles(){
  px.clearRect(0,0,p.width,p.height);
  for(const s of sparks){
    s.y -= s.v;
    if(s.y<0) s.y=p.height;

    px.fillStyle="#00ffd5";
    px.fillRect(s.x,s.y,s.s,s.s);
  }
}

/* LOOP */
function animate(){
  drawMatrix();
  drawParticles();
  requestAnimationFrame(animate);
}
animate();

window.addEventListener("resize",()=>{
  m.width=p.width=innerWidth;
  m.height=p.height=innerHeight;
});
</script>

</body>
</html>
