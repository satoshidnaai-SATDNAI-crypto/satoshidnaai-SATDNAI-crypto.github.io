<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Social Icons</title>
<style>
.social-icons {
    display: flex;
    gap: 15px;
}
.social-icons a img {
    width: 50px;
    height: 50px;
    transition: transform 0.2s;
}
.social-icons a img:hover {
    transform: scale(1.1);
}
</style>
</head>
<body>

<div class="social-icons">
  <a href="https://www.youtube.com" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube">
  </a>

  <a href="https://twitter.com" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg" alt="Twitter">
  </a>

  <a href="https://www.tiktok.com" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/TikTok_logo.svg" alt="TikTok">
  </a>

  <a href="https://www.instagram.com" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
  </a>

  <a href="https://t.me" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
  </a>
</div>

</body>
</html>
