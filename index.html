<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Icons Animation</title>
<style>
body{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.social-container{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.social-icon{
    width:50px;
    opacity:0;
    transform:translateY(-50px);
    animation: dropDown 0.6s ease forwards;
}

/* انیمیشن */
@keyframes dropDown{
    from{
        opacity:0;
        transform:translateY(-50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
<body>

<div class="social-container">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" class="social-icon" style="animation-delay:0s">
    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" class="social-icon" style="animation-delay:0.2s">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" class="social-icon" style="animation-delay:0.4s">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733635.png" class="social-icon" style="animation-delay:0.6s">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733558.png" class="social-icon" style="animation-delay:0.8s">
</div>

</body>
</html>
