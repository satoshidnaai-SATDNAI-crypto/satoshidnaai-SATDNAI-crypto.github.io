<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', Arial, sans-serif;
}

#logo {
  font-size:120px;
  font-weight:900;
  letter-spacing:4px;
  background: linear-gradient(90deg,#0ff,#1e90ff,#00ffd5,#1e90ff,#0ff);
  background-size:400% 100%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: shine 6s linear infinite, float 4s ease-in-out infinite;
  filter: drop-shadow(0 0 20px #00ffd5);
  position: relative;
}

@keyframes shine {
  0% {background-position:0%}
  100% {background-position:400%}
}

@keyframes float {
  0%,100% {transform:translateY(0)}
  50% {transform:translateY(-18px)}
}

/* digital particles */
.particle {
  position:absolute;
  width:4px;
  height:4px;
  background:#00ffd5;
  opacity:0.8;
  animation: particle 2s linear infinite;
}

@keyframes particle {
  0% {transform:translate(0,0) scale(1); opacity:1;}
  100% {transform:translate(var(--x),var(--y)) scale(0); opacity:0;}
}
</style>
</head>

<body>

<div id="logo">SATDNAI</div>

<script>
const logo = document.getElementById("logo");

setInterval(()=>{
  for(let i=0;i<12;i++){
    const p=document.createElement("div");
    p.className="particle";
    const r=logo.getBoundingClientRect();
    p.style.left=r.left+Math.random()*r.width+"px";
    p.style.top=r.top+Math.random()*r.height+"px";
    p.style.setProperty("--x",(Math.random()*200-100)+"px");
    p.style.setProperty("--y",(Math.random()*200-100)+"px");
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }
},180);
</script>

</body>
</html>
