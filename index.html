<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SATOSHI DNA AI - Matrix Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; }
        
        /* استایل بوم ماتریس */
        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* محتوای روی صفحه */
        .hero-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2); /* یک لایه بسیار نازک برای خوانایی بهتر لوگو */
        }

        .logo-box {
            width: 80%;
            max-width: 600px;
            /* این کد پس‌زمینه سیاه عکس را حذف و آن را با ماتریس ترکیب می‌کند */
            mix-blend-mode: screen; 
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 65, 0.5)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.8)); transform: scale(1.02); }
        }

        .solana-tag {
            margin-top: 30px;
            padding: 15px 30px;
            border: 2px solid #00ffa3;
            background: rgba(0, 0, 0, 0.8);
            color: #00ffa3;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .clock-container {
            margin-top: 20px;
            color: #ffd700;
            text-align: center;
        }

        #liveClock { font-size: 2.5rem; text-shadow: 0 0 15px #ffd700; }
        #liveDate { font-size: 1rem; opacity: 0.8; margin-bottom: 5px; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="hero-container">
        <img src="logo.png" alt="SATOSHI DNA AI" class="logo-box">
        
        <div class="clock-container">
            <div id="liveDate">LOADING DATE...</div>
            <div id="liveClock">00:00:00</div>
        </div>

        <div class="solana-tag">
            COMING SOON ON SOLANA NETWORK
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // کاراکترها: ژاپنی (کاتاکانا)، چینی، و انگلیسی
        const japanese = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
        const chinese = "龙币人工智能DNA";
        const english = "SATOSHIDNAAI0123456789";
        const allChars = japanese + chinese + english;

        const fontSize = 18;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            // ایجاد افکت محو شدن دنباله کاراکترها
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                // انتخاب تصادفی کاراکتر
                const text = allChars.charAt(Math.floor(Math.random() * allChars.length));
                
                // تغییر رنگ بر اساس نوع زبان برای وضوح بیشتر
                if (english.includes(text)) ctx.fillStyle = "#FFFFFF"; // انگلیسی سفید
                else if (chinese.includes(text)) ctx.fillStyle = "#FFD700"; // چینی طلایی
                else ctx.fillStyle = "#00FF41"; // ژاپنی سبز ماتریسی

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // آپدیت ساعت و تاریخ
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString();
            document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        setInterval(drawMatrix, 50);
        setInterval(updateClock, 1000);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
