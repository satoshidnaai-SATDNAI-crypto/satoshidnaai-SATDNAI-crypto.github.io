<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SATDNAI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,Helvetica,sans-serif;
}

/* لوگوی اصلی */
.logo-bg{
    position:fixed;
    inset:0;
    background:url("logo.jpg") no-repeat center center;
    background-size: contain;
    z-index:1;
}

/* محافظ ملایم */
.logo-protect{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.05);
    z-index:2;
}

/* ماتریکس */
canvas{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.22;
}

/* متن زیر لوگو */
.caption{
    position:fixed;
    bottom:40px;
    width:100%;
    text-align:center;
    z-index:5;
    animation: float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

.caption span{
    font-size:24px;
    letter-spacing:1px;
    color:#8fd3ff;
}

.solana{
    font-weight:bold;
    background:linear-gradient(90deg,#00ffa3,#03e1ff,#dc1fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 8px rgba(0,255,163,.4) }
    to{ text-shadow:0 0 18px rgba(3,225,255,.8) }
}

/* شبکه‌های اجتماعی */
.socials{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:16px;
    z-index:10;
}
.page2{
height:100vh;
position:relative;
background:black;
overflow:hidden;
}

#electric{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.btc{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:160px;
font-weight:900;
color:#ffcc33;
text-shadow:0 0 30px gold,0 0 80px orange;
}
.socials a{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation: pulse 2.5s infinite;
    transition:0.3s;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.12)}
    100%{transform:scale(1)}
}

.socials a:hover{
    background:rgba(0,255,163,0.25);
    transform:scale(1.25);
}

.socials img{
    width:26px;
    height:26px;
}
</style>
</head>

<body>

<div class="logo-bg"></div>
<div class="logo-protect"></div>
<canvas id="matrix"></canvas>

<div class="caption">
    <span>Coming Soon on the <span class="solana">Solana</span> Blockchain</span>
</div>

<div class="socials">
    <a href="https://t.me/SATDNAI" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">
    </a>
    <a href="https://www.tiktok.com/@satoshidnaai?is_from_webapp=1&sender_device=pc" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png">
    </a>
    <a href="https://www.youtube.com/@SATDNAI" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
    </a>
    <a href="https://x.com/SatoDnaAi" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968830.png">
    </a>
</div>
<section class="page2">
  <canvas id="electric"></canvas>
  <div class="btc">SATDNAI</div>
</section>
<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resize(){const e = document.getElementById("electric");
const ex = e.getContext("2d");

function er(){
e.width = innerWidth;
e.height = innerHeight;
}
er();
addEventListener("resize",er);

const pts=[];
for(let i=0;i<200;i++){
pts.push({x:Math.random()*e.width,y:Math.random()*e.height,
vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5});
}

function flow(){
ex.fillStyle="rgba(0,0,0,.15)";
ex.fillRect(0,0,e.width,e.height);

for(let i=0;i<pts.length;i++){
let a=pts[i];
a.x+=a.vx;a.y+=a.vy;
if(a.x<0||a.x>e.width)a.vx*=-1;
if(a.y<0||a.y>e.height)a.vy*=-1;

for(let j=i+1;j<pts.length;j++){
let b=pts[j];
let dx=a.x-b.x, dy=a.y-b.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<120){
ex.strokeStyle=rgba(255,180,0,${1-d/120});
ex.beginPath();
ex.moveTo(a.x,a.y);
ex.lineTo(b.x,b.y);
ex.stroke();
}
}
}
requestAnimationFrame(flow);
}
flow();
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

const chars = "01SATDNAIΞ₿ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 18;
let columns = Math.floor(canvas.width / fontSize);
let drops = new Array(columns).fill(1);

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#FFD700";
    ctx.font = fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){
        const char = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(char, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(draw,33);
</script>

</body>
</html>
