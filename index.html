<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Matrix Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            height: 100%; 
            background: #000; 
            color: #fff; 
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
        }

        /* اسکرول اسنپ */
        .main-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        section {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- صفحه اول: ماتریکس --- */
        #page1 { background: #000; }
        #matrixCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* --- صفحه دوم: ۱۰۰ ارز آنلاین --- */
        #page2 { background: #0a0a0a; flex-direction: column; padding: 20px; }
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #333;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .coin-card {
            background: #151515;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-bottom: 2px solid #222;
            transition: 0.3s;
        }
        .coin-card:hover { border-color: #0f0; transform: translateY(-5px); }
        .coin-card img { width: 30px; margin-bottom: 10px; }
        .price-up { color: #00ff88; }
        .price-down { color: #ff3366; }

        /* --- صفحه سوم: بیت کوین دیجیتال --- */
        #page3 { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
        }
        .circuit-bg {
            position: absolute; width: 100%; height: 100%;
            opacity: 0.3;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }
        .btc-glow {
            font-size: 180px;
            color: #f7931a;
            text-shadow: 0 0 80px rgba(247, 147, 26, 0.6);
            z-index: 2;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.1); filter: brightness(1.3); }
        }

        /* شخصی سازی اسکرول بار */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #0f0; border-radius: 10px; }
    </style>
</head>
<body>

<div class="main-container">
    
    <section id="page1">
        <canvas id="matrixCanvas"></canvas>
    </section>

    <section id="page2">
        <h2 style="margin-bottom: 20px; color: #0f0;">LIVE MARKET DATA (Top 100)</h2>
        <div class="crypto-grid" id="cryptoList">
            Loading Market Data...
        </div>
    </section>

    <section id="page3">
        <div class="circuit-bg"></div>
        <div class="btc-glow">₿</div>
    </section>

</div>

<script>
    /* --- Matrix Logic --- */
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = "01010101ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 40);

    /* --- Crypto API Logic (Live 100 Coins) --- */
    async function fetchCrypto() {
        try {
            const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false');
            const data = await response.json();
            const container = document.getElementById('cryptoList');
            container.innerHTML = '';

            data.forEach(coin => {
                const change = coin.price_change_percentage_24h;
                const card = 
                    <div class="coin-card">
                        <img src="${coin.image}" alt="${coin.name}">
                        <div style="font-weight:bold">${coin.symbol.toUpperCase()}</div>
                        <div class="price">$${coin.current_price.toLocaleString()}</div>
                        <div class="${change >= 0 ? 'price-up' : 'price-down'}">
                            ${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)}%
                        </div>
                    </div>
                ;
                container.innerHTML += card;
            });
        } catch (error) {
            console.log("Error fetching data", error);
        }
    }

    // آپدیت قیمت‌ها هر ۶۰ ثانیه
    fetchCrypto();
    setInterval(fetchCrypto, 60000);
</script>

</body>
</html>
