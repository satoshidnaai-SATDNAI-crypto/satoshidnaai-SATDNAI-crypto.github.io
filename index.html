<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matrix + Bitcoin Scene</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden;background:black;font-family:Arial}

section{height:100vh;width:100%;position:relative}

/* ===== Matrix Page ===== */
#matrix{background:black}
canvas{display:block}

/* ===== Bitcoin Page ===== */
#btc{
background:radial-gradient(circle at center,#0b2a4d,#000);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.bitcoin{
font-size:200px;
font-weight:900;
color:gold;
text-shadow:0 0 30px #ffcc33,0 0 60px orange;
position:relative;
z-index:2;
}

.lines{
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(90deg,rgba(255,215,0,.6) 1px,transparent 1px),
linear-gradient(0deg,rgba(0,200,255,.4) 1px,transparent 1px);
background-size:40px 40px;
animation:flow 10s linear infinite;
opacity:.5;
}

@keyframes flow{
from{background-position:0 0,0 0}
to{background-position:400px 0,0 400px}
}
</style>
</head>

<body>

<section id="matrix">
<canvas id="c"></canvas>
</section>

<section id="btc">
<div class="lines"></div>
<div class="bitcoin">₿</div>
</section>

<script>
/* ===== Matrix Effect ===== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01SATDNAI";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function draw(){
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#0F0";
ctx.font=fontSize+"px monospace";
for(let i=0;i<drops.length;i++){
const text = letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);
if(drops[i]*fontSize>canvas.height&&Math.random()>0.975)
drops[i]=0;
drops[i]++;
}
}
setInterval(draw,33);
</script>

</body>
</html>
