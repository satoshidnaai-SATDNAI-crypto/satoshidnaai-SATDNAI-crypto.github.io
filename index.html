<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعه انیمیشن‌های پیشرفته</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0b0e14;
            --accent: #00d2ff;
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow-x: hidden;
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #333;
            padding: 20px;
            position: relative;
        }

        h2 { color: var(--accent); margin-bottom: 30px; }

        /* 1. بخش گالری تصاویر */
        .gallery {
            display: flex;
            gap: 10px;
            width: 80%;
            height: 400px;
        }
        .gallery .img-card {
            flex: 1;
            transition: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid yellow;
        }
        .gallery .img-card:hover { flex: 5; }
        .gallery img { width: 100%; height: 100%; object-fit: cover; }

        /* 2. بخش ساعت مدرن */
        .clock-container {
            width: 300px; height: 300px;
            border: 10px solid #222;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #333, #000);
        }
        .hand {
            position: absolute; bottom: 50%; left: 50%;
            transform-origin: bottom; background: white;
            border-radius: 5px; transform: translateX(-50%);
        }
        #sec { width: 2px; height: 120px; background: red; z-index: 3; }
        #min { width: 4px; height: 100px; background: #ddd; z-index: 2; }
        #hour { width: 8px; height: 70px; background: #fff; z-index: 1; }

        /* 3. پس‌زمینه کهکشان (Canvas) */
        #galaxy-bg {
            position: fixed; top: 0; left: 0;
            z-index: -1; width: 100%; height: 100%;
        }

        /* 4. ناوبری متحرک */
        .nav-list {
            list-style: none; padding: 0;
        }
        .nav-item {
            background: white; color: black;
            margin: 10px; padding: 15px 40px;
            border-radius: 8px; cursor: pointer;
            transition: 0.3s; position: relative;
        }
        .nav-item:hover {
            transform: translateX(-10px);
            background: var(--accent); color: white;
        }
    </style>
</head>
<body>

    <canvas id="galaxy-bg"></canvas>

    <section>
        <h2>گالری تصاویر متحرک</h2>
        <div class="gallery">
            <div class="img-card"><img src="https://picsum.photos/800/601"></div>
            <div class="img-card"><img src="https://picsum.photos/800/602"></div>
            <div class="img-card"><img src="https://picsum.photos/800/603"></div>
            <div class="img-card"><img src="https://picsum.photos/800/604"></div>
        </div>
    </section>

    <section>
        <h2>زمان مدرن</h2>
        <div class="clock-container">
            <div id="hour" class="hand"></div>
            <div id="min" class="hand"></div>
            <div id="sec" class="hand"></div>
        </div>
    </section>

    <section>
        <h2>منوی متحرک</h2>
        <ul class="nav-list">
            <li class="nav-item">اینستاگرام</li>
            <li class="nav-item">تلگرام</li>
            <li class="nav-item">یوتیوب</li>
            <li class="nav-item">وب‌سایت ما</li>
        </ul>
    </section>

    <script>
        // --- کد ساعت ---
        function runClock() {
            const now = new Date();
            const s = now.getSeconds() * 6;
            const m = now.getMinutes() * 6;
            const h = (now.getHours() % 12) * 30 + (now.getMinutes() / 2);
            
            document.getElementById('sec').style.transform = translateX(-50%) rotate(${s}deg);
            document.getElementById('min').style.transform = translateX(-50%) rotate(${m}deg);
            document.getElementById('hour').style.transform = translateX(-50%) rotate(${h}deg);
        }
        setInterval(runClock, 1000);

        // --- کد پایه کهکشان (Three.js ساده شده) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('galaxy-bg'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const particlesGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(5000 * 3);

        for(let i=0; i < 5000 * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.005, color: '#00d2ff' });
        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);
        camera.position.z = 3;

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        // ریسپانسیو کردن Canvas
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
