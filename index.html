<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --satoshi-blue: #00d4ff; --dna-green: #39ff14; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; }
        
        /* پس‌زمینه ماتریکس */
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: 1; }

        .main-ui { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; align-items: center; background: transparent; overflow-y: auto; }
        
        nav { width: 100%; display: flex; justify-content: flex-end; padding: 20px 50px; }
        .nav-links a { color: var(--gold); text-decoration: none; margin-left: 25px; font-family: 'Orbitron'; font-size: 0.8rem; cursor: pointer; }

        .circle-container { display: flex; align-items: center; gap: 20px; margin-top: 10px; }
        .gold-circle {
            width: 130px; height: 130px; border: 2px solid var(--gold); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Orbitron'; font-weight: 900; background: rgba(0,0,0,0.6);
        }

        .brand-name { color: white; font-family: 'Orbitron'; letter-spacing: 12px; font-size: 3rem; margin: 20px 0; text-shadow: 0 0 10px #000; }
        
        .action-btn { 
            background: rgba(0,0,0,0.8); border: 2px solid var(--gold); color: var(--gold); 
            padding: 12px 40px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; margin-bottom: 10px;
        }

        /* --- راه حل نهایی برای حذف کادر سیاه لوگو --- */
        .logo-container {
            width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* این دستور جادویی سیاهی مطلق را حذف و باران ماتریکس را از پشت آن نشان می‌دهد */
            mix-blend-mode: screen; 
            margin-top: -20px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            /* افزایش تضاد باعث می‌شود لبه‌های خاکستری/سیاه کاملاً شفاف شوند */
            filter: contrast(1.2) brightness(1.1); 
        }

        #docOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; display: none; overflow-y: auto; padding: 60px 20px; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="main-ui">
        <nav>
            <div class="nav-links"><a onclick="openDocs()">ABOUT</a><a onclick="openDocs()">TOKENOMICS</a></div>
        </nav>

        <div class="circle-container">
            <div class="gold-circle" style="color:var(--satoshi-blue)">SATOSHI</div>
            <div style="color:var(--gold); font-size:2rem">+</div>
            <div class="gold-circle" style="color:var(--dna-green)">DNA</div>
            <div style="color:var(--gold); font-size:2rem">+</div>
            <div class="gold-circle" style="color:var(--gold)">AI</div>
        </div>

        <h1 class="brand-name">SATOSHIDNAAI</h1>
        <button class="action-btn" onclick="openDocs()">ENTER DOCUMENTATION</button>

        <div class="logo-container">
            <img src="01.jpeg" alt="Logo">
        </div>
    </div>

    <script>
        function openDocs() { document.getElementById('docOverlay').style.display = 'block'; }
        
        // کد ماتریکس
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const char = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = char.charAt(Math.floor(Math.random() * char.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 35);
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    </script>
</body>
</html>
