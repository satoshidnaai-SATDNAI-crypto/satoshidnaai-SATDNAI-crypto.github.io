<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATOSHI DNA AI | Official Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --matrix-green: #00FF41;
            --gold: #FFD700;
            --solana: #00ffa3;
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            color: white; 
            font-family: 'Orbitron', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden; 
        }

        /* --- Price Ticker --- */
        .price-ticker {
            width: 100%;
            background: rgba(0, 255, 65, 0.1);
            border-bottom: 1px solid var(--matrix-green);
            padding: 5px 0;
            position: fixed;
            top: 0;
            z-index: 2000;
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-content {
            display: inline-block;
            animation: ticker 30s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ticker-content span { margin-right: 40px; font-size: 0.8rem; color: var(--solana); }

        /* --- Navbar --- */
        nav {
            width: 100%;
            height: 70px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            box-sizing: border-box;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-links a { color: white; text-decoration: none; margin: 0 20px; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--matrix-green); }
        .connect-btn { 
            background: transparent; 
            border: 1px solid var(--gold); 
            color: var(--gold); 
            padding: 8px 20px; 
            cursor: pointer;
        }

        /* --- Hero Section: Logo & Matrix --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000; /* زمینه سیاه مطلق */
            overflow: hidden;
        }

        /* لوگو زیر ماتریکس */
        .logo-under-matrix {
            position: absolute;
            width: 550px; /* سایز لوگو */
            z-index: 1;
            mix-blend-mode: screen; /* حذف هوشمند پس‌زمینه غیرشفاف لوگو */
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0,255,65,0.2));
        }

        /* ماتریکس روی لوگو */
        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.9;
        }

        /* متن زیر لوگو */
        .hero-footer-text {
            position: absolute;
            bottom: 15%;
            z-index: 3;
            text-align: center;
            width: 100%;
        }

        /* --- Content Section --- */
        .about-section { 
            background: #000; 
            padding: 100px 20px;
            text-align: center;
            border-top: 1px solid #222;
        }
        .rings-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 50px 0; }
        .ring {
            width: 180px; height: 180px;
            border: 2px solid var(--matrix-green);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }
        .description-box {
            max-width: 800px; margin: 0 auto; padding: 30px;
            background: rgba(255,255,255,0.02);
            line-height: 1.8; text-align: justify; direction: rtl;
            border-right: 4px solid var(--gold);
        }
    </style>
</head>
<body>

    <div class="price-ticker">
        <div class="ticker-content">
            <span>BTC: $68,432.21</span> <span>ETH: $3,542.10</span> <span>SOL: $145.65</span> 
            <span>SATOSHI DNA: $0.00001 (PRE-SALE)</span> <span>BNB: $590.12</span>
        </div>
    </div>

    <nav>
        <div style="font-weight: 900; color: var(--matrix-green);">SATOSHI+DNA+AI</div>
        <div class="nav-links">
            <a href="#">HOME</a>
            <a href="#about">ABOUT</a>
            <button class="connect-btn">CONNECT WALLET</button>
        </div>
    </nav>

    <section class="hero-section">
        <img src="logo.png" alt="Satoshi DNA AI" class="logo-under-matrix">

        <canvas id="matrixCanvas"></canvas>

        <div class="hero-footer-text">
            <p style="color: var(--solana); letter-spacing: 8px; font-weight: bold; font-size: 1.1rem; opacity: 0.8;">
                DECENTRALIZED INTELLIGENCE
            </p>
        </div>
    </section>

    <section id="about" class="about-section">
        <div class="rings-container">
            <div class="ring">SATOSHI</div>
            <span style="font-size: 2rem; color: var(--gold);">+</span>
            <div class="ring">DNA</div>
            <span style="font-size: 2rem; color: var(--gold);">+</span>
            <div class="ring">AI</div>
        </div>
        <div class="description-box">
            <p>پروژه SATOSHI DNA AI تلفیقی از میراث بیت‌کوین و هوش مصنوعی پیشرفته بر بستر سولانا است.</p>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // کاراکترها و رنگ‌ها (سه زبانه)
        const japanese = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
        const chinese = "龙币人工智能DNA";
        const english = "SATOSHIDNAAI0123456789";
        const allChars = japanese + chinese + english;

        const fontSize = 18;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const char = allChars.charAt(Math.floor(Math.random() * allChars.length));
                
                // تفکیک رنگ بر اساس زبان
                if (english.includes(char)) ctx.fillStyle = "#FFFFFF"; 
                else if (chinese.includes(char)) ctx.fillStyle = "#FFD700"; 
                else ctx.fillStyle = "#00FF41"; 

                ctx.fillText(char, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 50);
    </script>
</body>
</html>
