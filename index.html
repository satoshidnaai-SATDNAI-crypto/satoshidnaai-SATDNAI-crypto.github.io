<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi DNA AI - New Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --m-green: #00FF41;
            --m-gold: #FFD700;
            --m-white: #FFFFFF;
        }

        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: 'Orbitron', sans-serif; overflow-x: hidden; }

        /* --- شبکه‌های اجتماعی اسلو موشن --- */
        .social-sidebar {
            position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px; z-index: 3000;
        }
        .social-sidebar i {
            font-size: 24px; color: var(--m-gold); animation: slowFloat 4s ease-in-out infinite;
        }
        @keyframes slowFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* --- کانتینر اصلی --- */
        .hero { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #main-logo { width: 350px; position: absolute; z-index: 1; filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)); }
        
        #matrixCanvas { position: absolute; top: 0; left: 0; z-index: 2; mix-blend-mode: screen; opacity: 0.7; }

        /* --- بخش زیر لوگو (ساعت، تاریخ، قیمت) --- */
        .info-under-logo {
            position: relative; z-index: 10; margin-top: 400px; text-align: center;
            background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; border: 1px solid var(--m-gold);
        }
        .prices { color: var(--m-green); font-size: 0.9rem; margin-bottom: 10px; word-spacing: 15px; }
        .datetime { color: var(--m-white); font-size: 1.2rem; font-weight: bold; }
        
        /* --- ثانیه‌شمار پایین صفحه --- */
        .footer-counter {
            position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 10;
        }
        .score-box {
            display: inline-block; padding: 10px 25px; border: 2px solid var(--m-green);
            color: var(--m-green); font-size: 1.5rem; background: rgba(0,255,65,0.1);
            box-shadow: 0 0 15px var(--m-green); text-shadow: 0 0 5px #000;
        }

        /* صفحه دوم */
        .rings-section { min-height: 100vh; background: #080808; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 2px solid var(--m-gold); }
        .ring-group { display: flex; align-items: center; gap: 20px; margin: 50px 0; }
        .ring { width: 120px; height: 120px; border: 3px solid var(--m-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 0 20px var(--m-gold); }
    </style>
</head>
<body>

    <div class="social-sidebar">
        <i class="fab fa-facebook"></i><i class="fab fa-tiktok"></i><i class="fab fa-telegram"></i>
        <i class="fab fa-twitter"></i><i class="fab fa-instagram"></i>
    </div>

    <div class="hero">
        <img src="logo.png" id="main-logo" alt="Satoshi DNA">
        
        <canvas id="matrixCanvas"></canvas>

        <div class="info-under-logo">
            <div class="prices">
                BTC: $68,432 &nbsp; SOL: $145 &nbsp; DNA: $0.0004 &nbsp; ETH: $3,510
            </div>
            <div class="datetime" id="liveClock">
                00:00:00 - 2026/01/25
            </div>
        </div>

        <div class="footer-counter">
            <div class="score-box" id="score">SEC: 00</div>
        </div>
    </div>

    <section class="rings-section">
        <div class="ring-group">
            <div class="ring">SATOSHI</div> <span>+</span>
            <div class="ring">DNA</div> <span>+</span>
            <div class="ring">AI</div>
        </div>
    </section>

    <script>
        // کدهای ماتریس با سه رنگ سفید، طلایی و سبز
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const colors = ["#00FF41", "#FFD700", "#FFFFFF"]; // سبز، طلایی، سفید
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        // ساعت و ثانیه شمار
        let seconds = 0;
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const dateStr = now.toLocaleDateString();
            document.getElementById('liveClock').innerText = `${timeStr} - ${dateStr}`;
            
            seconds++;
            document.getElementById('score').innerText = "SEC: " + (seconds < 10 ? "0" + seconds : seconds);
        }

        setInterval(drawMatrix, 40);
        setInterval(updateClock, 1000);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
